<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060b">
<title>Jarvis</title>
<style>
:root{
  --c:#00c8ff; --c-rgb:0,200,255;
  --bg:#02060b; --ink:#dcf6ff; --dim:#8cadbd; --faint:#55788a;
  --glass:rgba(3,12,20,.66);
  --display:"Bahnschrift","DIN Alternate","DIN Next","Avenir Next Condensed","Roboto Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden}
body{font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:3px;border-radius:6px}

#ceu,#brain{position:fixed;inset:0;width:100%;height:100%;display:block}
#ceu{pointer-events:none}
#brain{touch-action:none;mix-blend-mode:screen}
body:not(.live) #brain{pointer-events:none}
.veil{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(130% 95% at 50% 43%,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ── barra superior ── */
.top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:calc(14px + env(safe-area-inset-top)) 22px 0;pointer-events:none;opacity:0;transition:opacity .7s ease}
.live .top{opacity:1}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.pulse{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c),0 0 22px rgba(var(--c-rgb),.75)}
[data-state="listening"] .pulse{animation:beat 1.1s ease-in-out infinite}
[data-state="thinking"] .pulse{animation:beat .45s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.7);opacity:.55}}
.name{font:700 21px/1 var(--display);letter-spacing:.06em;font-variation-settings:"wdth" 82;color:#f2fdff;text-shadow:0 0 18px rgba(var(--c-rgb),.55)}
.state{color:var(--dim);font-size:14px;white-space:nowrap}
.ctx{display:inline-flex;align-items:center;gap:7px;padding:2px 10px;border:1px solid rgba(var(--c-rgb),.55);border-radius:999px;
  color:var(--c);font:600 13px/1.4 var(--display);letter-spacing:.03em;background:rgba(var(--c-rgb),.08)}
.meta{display:flex;align-items:baseline;gap:20px;color:var(--dim);font:500 14px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.meta b{color:var(--ink);font-weight:600}
.clock{color:var(--ink);font-size:17px}

/* ── painéis laterais: conversa (esquerda) e avisos (direita) ── */
:root{--esq:0px;--dir:0px}
.lado{position:fixed;top:calc(60px + env(safe-area-inset-top));bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;width:var(--larg);
  display:flex;flex-direction:column;background:rgba(3,12,20,.6);border:1px solid rgba(var(--c-rgb),.22);border-radius:16px;
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 40px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .6s ease .15s,transform .38s cubic-bezier(.2,.8,.2,1)}
.live .lado{opacity:1;pointer-events:auto}
.conversa{--larg:min(370px,29vw);left:16px}
.avisos{--larg:min(320px,25vw);right:16px}
.live .lado.min{opacity:0;pointer-events:none}
.conversa.min{transform:translateX(calc(-100% - 24px))}
.avisos.min{transform:translateX(calc(100% + 24px))}
.cab{display:flex;align-items:center;gap:6px;padding:9px 8px 8px 14px;border-bottom:1px solid rgba(var(--c-rgb),.14)}
.cab h2{flex:1;margin:0;font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cab .ib{width:32px;height:32px}
.cab .ib svg{width:18px;height:18px}
.rolar{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 12px 16px;scrollbar-width:thin;scrollbar-color:rgba(var(--c-rgb),.35) transparent}
.rolar::-webkit-scrollbar{width:8px}
.rolar::-webkit-scrollbar-thumb{background:rgba(var(--c-rgb),.3);border-radius:8px}
.log{display:flex;flex-direction:column;gap:10px}
.msg{padding:1px 0 1px 11px;border-left:2px solid rgba(var(--c-rgb),.8);font-size:15.5px;line-height:1.55;color:#f1fcff;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;max-width:90%;padding:7px 11px;border:0;border-radius:12px 12px 4px 12px;background:rgba(255,255,255,.075);color:var(--ink);font-size:14.5px}
.msg.err{border-left-color:#ff2450}
.msg time{display:block;margin-top:3px;color:var(--faint);font-size:11px;font-variant-numeric:tabular-nums}
.msg.wait .txt::after{content:"";display:inline-block;width:.5em;height:1em;margin-left:2px;vertical-align:-2px;background:var(--c);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.sep{align-self:center;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--faint);font-size:11.5px;letter-spacing:.04em}
.vazio{color:var(--faint);font-size:13.5px;line-height:1.55;padding:4px 2px}
.novas{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:5px 13px;border-radius:999px;border:1px solid rgba(var(--c-rgb),.6);
  background:rgba(2,8,14,.94);color:var(--ink);font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.aba{position:fixed;top:50%;z-index:6;display:none;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border:1px solid rgba(var(--c-rgb),.35);
  background:rgba(3,12,20,.78);color:var(--dim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transform:translateY(-50%);transition:color .2s}
.aba:hover{color:var(--ink)}
.aba-esq{left:0;border-left:0;border-radius:0 12px 12px 0}
.aba-dir{right:0;border-right:0;border-radius:12px 0 0 12px}
.live .aba.on{display:flex}
.aba svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--c);color:#02060b;font:700 11px/18px var(--body);text-align:center}
.badge:empty{display:none}
.cards{display:flex;flex-direction:column;gap:10px}
.card{--k:var(--c-rgb);position:relative;padding:10px 12px;border-radius:12px;background:rgba(var(--k),.07);border:1px solid rgba(var(--k),.3);animation:entra .35s ease}
.card.alerta{--k:255,60,95}
.card.noticia{--k:0,200,255}
.card.fonte{--k:150,170,255}
.card.lista,.card.numero{--k:255,190,60}
.card.dica,.card.sistema{--k:140,173,189}
.card h4{display:flex;align-items:center;gap:7px;margin:0 24px 5px 0;font:600 14px/1.3 var(--display);letter-spacing:.02em;color:#f2fdff}
.card h4 svg{flex:none;width:15px;height:15px;stroke:rgb(var(--k));fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card p{margin:0;font-size:13.5px;line-height:1.5;color:var(--ink)}
.card ol,.card ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.card li{font-size:13px;line-height:1.45;color:var(--dim)}
.card li b{display:block;color:var(--ink);font-weight:600}
.card a{color:rgb(var(--k));text-decoration:none;overflow-wrap:anywhere}
.card a:hover{text-decoration:underline}
.card time{display:block;margin-top:7px;color:var(--faint);font-size:11px}
.card .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border:0;border-radius:6px;background:none;color:var(--faint);display:grid;place-items:center}
.card .x:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.card .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}}

/* ── barra de mensagem (embaixo, entre os painéis) ── */
.console{position:fixed;left:calc(var(--esq) + 16px);right:calc(var(--dir) + 16px);bottom:calc(16px + env(safe-area-inset-bottom));
  margin:0 auto;max-width:620px;z-index:6;opacity:0;pointer-events:none;transition:opacity .7s ease .15s,left .38s ease,right .38s ease}
.live .console{opacity:1;pointer-events:auto}
.interim{min-height:22px;margin:2px 0 6px 15px;color:var(--faint);font-size:14px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 0 8px #000}

.bar{display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--glass);border:1px solid rgba(var(--c-rgb),.32);border-radius:999px;
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 0 30px rgba(var(--c-rgb),.14)}
.bar input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:9px 8px;font-size:16px;caret-color:var(--c)}
.bar input::placeholder{color:var(--faint)}
.ib{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--dim);transition:color .2s,background-color .2s}
.ib:hover{color:var(--ink);background:rgba(var(--c-rgb),.12)}
.ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#mic.hot{color:var(--c);background:rgba(var(--c-rgb),.12);animation:ring 1.8s ease-out infinite}
#mic.off{color:var(--faint)}
#mic.off .slash,#mute.on .slash{display:inline}
.slash{display:none}
#mute.on .waves{display:none}
#mute.on{color:#ff6b8a}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(var(--c-rgb),.55)}100%{box-shadow:0 0 0 13px rgba(var(--c-rgb),0)}}

.keybar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 10px;padding:10px 12px;background:var(--glass);
  border:1px solid rgba(255,36,80,.5);border-radius:14px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.keybar label{flex:1 1 100%;font-size:14px;color:var(--ink)}
.keybar label small{display:block;color:var(--faint);font-size:12.5px}
.keybar input{flex:1;min-width:0;padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);outline:0}
.keybar input:focus{border-color:var(--c)}
.keybar button{padding:8px 16px;border-radius:8px;border:1px solid var(--c);background:rgba(var(--c-rgb),.14);color:var(--ink);font-weight:600}

/* ── ficha de nota ── */
.panel{--hc:0,200,255;position:fixed;top:0;right:0;bottom:0;z-index:7;width:min(380px,100%);overflow:auto;
  padding:calc(74px + env(safe-area-inset-top)) 26px 28px 28px;
  background:linear-gradient(to left,rgba(2,8,14,.95),rgba(2,8,14,.82));border-left:1px solid rgba(var(--hc),.6);
  box-shadow:-20px 0 60px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transform:translateX(104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.panel.open{transform:none;visibility:visible}
.panel .close{position:absolute;top:calc(18px + env(safe-area-inset-top));right:14px}
.cat{display:flex;align-items:center;gap:9px;color:rgb(var(--hc));font:600 14px/1 var(--display);letter-spacing:.03em}
.cat i{width:9px;height:9px;border-radius:50%;background:rgb(var(--hc));box-shadow:0 0 12px rgb(var(--hc))}
.panel h2{margin:12px 0 0;font:700 28px/1.1 var(--display);font-variation-settings:"wdth" 85;color:#f4fdff}
.panel p{margin:16px 0 24px;font-size:16px;line-height:1.6;color:var(--ink);max-width:52ch}
.panel h3{margin:0 0 8px;color:var(--faint);font:500 13px/1 var(--body)}
.links{list-style:none;margin:0 0 24px;padding:0}
.links button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 0;border:0;background:none;text-align:left;color:var(--dim);font-size:15px}
.links button:hover{color:var(--ink)}
.links i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--dot);box-shadow:0 0 8px var(--dot)}
.del{padding:8px 14px;border-radius:8px;border:1px solid rgba(255,36,80,.5);background:transparent;color:#ff8aa2;font-size:14px}
.del.armed{background:rgba(255,36,80,.18);color:#fff}

.tip{position:fixed;left:0;top:0;z-index:8;pointer-events:none;padding:6px 11px;border-radius:7px;background:rgba(2,8,14,.92);
  border:1px solid rgba(var(--c-rgb),.45);font:600 14px/1.25 var(--display);color:#f2fdff;opacity:0;transition:opacity .12s;max-width:260px}
.tip small{display:block;color:var(--dim);font:400 12px/1.4 var(--body)}
.tip.on{opacity:1}
.toast{position:fixed;left:0;right:0;top:calc(60px + env(safe-area-inset-top));margin:0 auto;width:max-content;max-width:calc(100% - 32px);z-index:9;
  padding:8px 16px;border-radius:999px;background:rgba(2,8,14,.92);border:1px solid rgba(var(--c-rgb),.6);color:var(--ink);font-size:14px;
  opacity:0;transform:translateY(-6px);transition:opacity .3s,transform .3s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* ── inicialização ── */
.boot{position:fixed;inset:0;z-index:20;pointer-events:none;transition:opacity .9s ease,visibility 0s}
.boot.off{opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s .9s}
.blog{position:absolute;left:28px;bottom:calc(26px + env(safe-area-inset-bottom));margin:0;font:12.5px/1.75 var(--mono);color:rgba(var(--c-rgb),.75);white-space:pre}
.blog .ok{color:var(--c);text-shadow:0 0 10px rgba(var(--c-rgb),.8)}
.blog .warn{color:#ffb21e}
.startwrap{position:absolute;left:0;right:0;bottom:calc(34px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.start{pointer-events:auto;padding:13px 30px;border-radius:999px;border:1px solid var(--c);background:rgba(var(--c-rgb),.1);color:#f2fdff;
  font:700 18px/1 var(--display);letter-spacing:.05em;box-shadow:0 0 28px rgba(var(--c-rgb),.35),inset 0 0 18px rgba(var(--c-rgb),.18);
  animation:ring 2.2s ease-out infinite;transition:background-color .2s}
.start:hover{background:rgba(var(--c-rgb),.24)}
.hint{margin:0;color:var(--faint);font-size:14px}

@media (max-width:760px){
  .conversa{--larg:auto;left:10px;right:10px;top:auto;bottom:calc(84px + env(safe-area-inset-bottom));height:34vh;border-radius:14px}
  .conversa.min{transform:translateY(calc(100% + 100px))}
  .avisos{--larg:auto;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top));bottom:calc(84px + env(safe-area-inset-bottom))}
  .console{left:10px;right:10px}
  .aba-esq{top:auto;bottom:calc(92px + env(safe-area-inset-bottom));transform:none;flex-direction:row;padding:8px 10px}
  .aba-dir{top:calc(64px + env(safe-area-inset-top));transform:none;flex-direction:row;padding:8px 10px}
}
@media (max-width:640px){
  .top{padding:calc(12px + env(safe-area-inset-top)) 16px 0}
  .meta .stats,#date{display:none}
  .who{gap:9px}
  .state{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .name{font-size:19px}
  .msg{font-size:15.5px}
  .panel{top:auto;height:62vh;width:100%;border-left:0;border-top:1px solid rgba(var(--hc),.6);padding:22px 20px 28px;transform:translateY(104%);border-radius:18px 18px 0 0}
  .panel .close{top:10px}
  .blog{left:16px;right:16px;font-size:11px;bottom:calc(18px + env(safe-area-inset-bottom))}
  .startwrap{bottom:calc(196px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body data-state="boot">
<canvas id="ceu" aria-hidden="true"></canvas>
<canvas id="brain" aria-label="Galáxia do Jarvis: uma estrela para cada skill"></canvas>
<div class="veil"></div>

<header class="top">
  <div class="who">
    <span class="pulse"></span>
    <span class="name">Jarvis</span>
    <span class="state" id="state" role="status">iniciando</span>
    <span class="ctx" id="ctx" hidden></span>
  </div>
  <div class="meta">
    <span class="stats" id="stats"></span>
    <span id="date"></span>
    <span class="clock" id="clock"></span>
  </div>
</header>

<aside class="panel" id="panel" aria-label="Detalhes da estrela">
  <button class="ib close" id="pclose" aria-label="Fechar nota"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <div class="cat"><i></i><span id="pcat"></span></div>
  <h2 id="ptitle"></h2>
  <p id="ptext"></p>
  <div id="plinkwrap"><h3 id="plinkh">Conectada a</h3><ul class="links" id="plinks"></ul></div>
  <button class="del" id="pdel" hidden>Excluir nota</button>
</aside>

<div class="tip" id="tip"></div>
<div class="toast" id="toast" role="status"></div>

<aside class="lado conversa" id="conversa" aria-label="Conversa">
  <div class="cab"><h2>Conversa</h2>
    <button class="ib" id="minConversa" aria-label="Minimizar a conversa" title="Minimizar"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
  <div class="rolar" id="rolaConversa"><div class="log" id="log" aria-live="polite"></div></div>
  <button class="novas" id="novas" hidden>Novas mensagens ↓</button>
</aside>
<button class="aba aba-esq" id="abaConversa" aria-label="Mostrar a conversa"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="badge" id="nConversa"></span></button>

<aside class="lado avisos" id="avisos" aria-label="Painel de avisos e conteúdos">
  <div class="cab"><h2>Painel</h2>
    <button class="ib" id="limparAvisos" aria-label="Limpar o painel" title="Limpar"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg></button>
    <button class="ib" id="minAvisos" aria-label="Minimizar o painel" title="Minimizar"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>
  <div class="rolar" id="rolaAvisos"><div class="cards" id="cards"></div></div>
</aside>
<button class="aba aba-dir" id="abaAvisos" aria-label="Mostrar o painel de avisos"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/></svg><span class="badge" id="nAvisos"></span></button>

<main class="console">
  <div class="interim" id="interim"></div>
  <form class="keybar" id="keybar" hidden autocomplete="off">
    <label for="key"><span id="keymsg">Cole sua chave da API da Anthropic para o Jarvis pensar.</span>
      <small id="keysub">Ela fica guardada só neste navegador e é enviada apenas para api.anthropic.com.</small></label>
    <input id="key" type="password" placeholder="sk-ant-..." spellcheck="false">
    <button type="submit">Salvar chave</button>
  </form>
  <form class="bar" id="form" autocomplete="off">
    <button type="button" class="ib" id="mic" aria-pressed="true" aria-label="Microfone">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg></button>
    <input id="txt" type="text" placeholder="Diga “Jarvis…” ou escreva aqui" aria-label="Mensagem para o Jarvis" enterkeyhint="send">
    <button type="button" class="ib" id="mute" aria-pressed="false" aria-label="Silenciar a voz do Jarvis">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M16 9l5 6M21 9l-5 6"/></svg></button>
    <button type="submit" class="ib" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
  </form>
</main>

<section class="boot" id="boot">
  <pre class="blog" id="blog" aria-live="polite"></pre>
  <div class="startwrap">
    <button class="start" id="start" hidden>Ativar o Jarvis</button>
    <p class="hint" id="bhint" hidden>O navegador vai pedir permissão para usar o microfone.</p>
  </div>
</section>

<script>
(() => {
'use strict';
/* ═════════════════════════════════════════════════════════════════════════════════════
   PERFIL — personalize aqui. É a única parte que você precisa mudar.
   - Quem é você e como o Jarvis te chama (CONFIG, logo abaixo)
   - A personalidade dele e as cores de cada assunto (TEMAS)

const $ = (s, r = document) => r.querySelector(s);

const STOP = new Set(('que por com uma uns umas dos das nos nas mas sao era ser tem ter foi seu sua seus suas meu minha ele ela eles elas nao sim aos pra pro cada para pelo pela como mais entre sobre quando onde muito ainda mesmo todos toda todo apos desde sem voce esta estao isso esse essa este tambem ate usa usar faz fez vai vem the and com').split(' '));

const Brain = {
  notes: [], byId: new Map(), df: new Map(), KEY: 'jarvis.notas.v1',
  load() {
    this.notes = []; this.byId.clear();
    for (const n of NOTAS) this._push({ id: n.id, hub: n.hub, title: n.t, text: n.x, links: n.l || [], sys: !!n.sys, user: false });
    for (const n of store.get(this.KEY, [])) if (n && n.id && !this.byId.has(n.id)) this._push({ ...n, user: true });
    this._index();
  },
  _push(n) { n.tok = tokens(n.title + ' ' + n.text); n.tokT = new Set(tokens(n.title)); this.notes.push(n); this.byId.set(n.id, n); },
  _index() { this.df.clear(); for (const n of this.notes) for (const w of n.tok) this.df.set(w, (this.df.get(w) || 0) + 1); },
  idf(w) { return Math.log(1 + this.notes.length / (this.df.get(w) || 1)); },
  hubName(id) { return (HUBS.find(h => h.id === id) || HUBS[HUBS.length - 1]).nome; },

  /* notas mais ligadas a um texto (busca local, para acender o grafo e conectar notas novas) */
  search(q, limit = 6) {
    const qt = tokens(q); if (!qt.length) return [];
    const out = [];
    for (const n of this.notes) {
      let s = 0;
      for (const w of qt) {
        if (n.tok.includes(w)) s += this.idf(w) * (n.tokT.has(w) ? 2 : 1);
        else if (w.length >= 5 && n.tok.some(x => x.length >= 5 && x.slice(0, 5) === w.slice(0, 5))) s += this.idf(w) * 0.5;
      }
      if (s > 0) out.push([n, s]);
    }
    out.sort((a, b) => b[1] - a[1]);
    const top = out.length ? out[0][1] : 0;
    return out.filter(x => x[1] >= Math.max(1.4, top * 0.45)).slice(0, limit).map(x => x[0]);
  },
  classify(text) {
    const t = norm(text); let best = 'memorias', bs = 0;
    for (const h of HUBS) { let s = 0; for (const k of h.kw) if (t.includes(k)) s++; if (s > bs) { bs = s; best = h.id; } }
    return best;
  },
  local: false,
  async addUser(text) {
    const clean = text.replace(/\s+/g, ' ').trim().replace(/[.!]+$/, '');
    const body = clean.charAt(0).toUpperCase() + clean.slice(1) + '.';
    const words = clean.split(' ');
    let title = words.slice(0, 6).join(' ');
    if (words.length > 6) title += '…';
    title = title.charAt(0).toUpperCase() + title.slice(1);
    const hub = this.classify(clean), links = this.search(clean, 3).filter(x => !x.sys).slice(0, 2).map(x => x.id);
    if (this.local) {                       // vira um arquivo Markdown (no cofre do Obsidian, se houver)
      try {
        const r = await fetch(CONFIG.local.url + '/notas', { method: 'POST', headers: { 'content-type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ titulo: title, texto: body, area: hub, conexoes: links }) });
        if (r.ok) { const n = this.fromServer(await r.json()); this._push(n); this.resolveLinks(n); this._index(); return n; }
      } catch {}
    }
    const n = { id: 'u' + Date.now().toString(36), hub, title, text: body, links, created: new Date().toISOString(), user: true };
    this._push(n); this._index(); this._save();
    return n;
  },
  async remove(id) {
    const n = this.byId.get(id); if (!n || !n.user) return 'Esta nota é fixa.';
    if (n.arquivo) {
      if (!n.editavel) return 'Esta nota veio do Obsidian. Edite ou apague por lá.';
      try {
        const r = await fetch(CONFIG.local.url + '/notas/' + encodeURIComponent(id), { method: 'DELETE' });
        if (!r.ok) return ((await r.json().catch(() => ({}))).erro) || 'Não consegui apagar a nota.';
      } catch { return 'O servidor do Jarvis não respondeu.'; }
    }
    this.notes = this.notes.filter(x => x !== n); this.byId.delete(id);
    for (const o of this.notes) o.links = (o.links || []).filter(x => x !== id);
    this._index(); if (!n.arquivo) this._save();
    return '';
  },
  _save() { store.set(this.KEY, this.notes.filter(n => n.user && !n.arquivo).map(({ id, hub, title, text, links, created }) => ({ id, hub, title, text, links, created }))); },
  fromServer(n) {
    const area = HUBS.some(h => h.id === n.area) ? n.area : this.classify(n.titulo + ' ' + n.texto);
    return { id: n.id, hub: area, title: n.titulo, text: n.texto || n.titulo, links: n.conexoes || [], user: true, arquivo: n.arquivo, editavel: !!n.editavel };
  },
  resolveLinks(n) {   // conexões por id ou por título ([[links]] do Obsidian)
    n.links = [...new Set((n.links || []).map(l => this.byId.has(l) ? l : (this.notes.find(x => norm(x.title) === norm(l)) || {}).id))].filter(id => id && id !== n.id);
  },
  /* traz as notas em Markdown do servidor e migra as que estavam só no navegador */
  async syncLocal() {
    const url = CONFIG.local.url, post = n => fetch(url + '/notas', { method: 'POST', headers: { 'content-type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ titulo: n.title, texto: n.text, area: n.hub, conexoes: n.links }) });
    try {
      for (const n of this.notes.filter(x => x.user && !x.arquivo)) { const r = await post(n); if (!r.ok) return null; }
      const lista = await (await fetch(url + '/notas')).json();
      const removidas = this.notes.filter(n => n.user).map(n => n.id);
      this.notes = this.notes.filter(n => !n.user); this.byId = new Map(this.notes.map(n => [n.id, n]));
      const novas = lista.map(x => this.fromServer(x));
      for (const n of novas) this._push(n);
      for (const n of novas) this.resolveLinks(n);
      this._index(); this.local = true; store.set(this.KEY, []);
      return { removidas, novas };
    } catch { return null; }
  },

  /* texto do Second Brain enviado ao cérebro (Claude) */
  forPrompt() {
    const recentes = new Set(this.notes.filter(n => n.user).slice(-150).map(n => n.id));   // limita o contexto
    return HUBS.map(h => {
      const ns = this.notes.filter(n => n.hub === h.id && !n.sys && (!n.user || recentes.has(n.id)));
      if (!ns.length) return '';
      return `## ${h.nome}\n` + ns.map(n => `- [${n.id}] ${n.title}: ${n.text}`).join('\n');
    }).filter(Boolean).join('\n\n');
  },
};

/* ═════════ TEMA NEON — a cor da interface é o estado do Jarvis ═════════ */
const Theme = {
  cur: COR.azul.slice(), tgt: COR.azul, osc: false, mode: 'idle', name: null, applied: '',
  idle() { this.mode = 'idle'; this.osc = false; this.tgt = COR.azul; this._name(''); },
  respond(tema) {
    const T = TEMAS[tema] || TEMAS.geral;
    this.mode = 'respond'; this.osc = !!T.osc; this.tgt = COR[T.cor]; this._name(T.nome || '');
  },
  _name(n) { if (n !== this.name) { this.name = n; UI.context(n); } },
  tick(t, dt) {
    let goal = this.tgt;
    if (this.osc) { const k = (Math.sin(t / 520) + 1) / 2; goal = mix(COR.azul, COR.violeta, k * k * (3 - 2 * k)); }
    else if (this.mode === 'respond') goal = mix(this.tgt, [255, 255, 255], 0.07 * (Math.sin(t / 260) + 1));
    const f = 1 - Math.exp(-dt * (this.osc ? 8 : 4));
    for (let i = 0; i < 3; i++) this.cur[i] = lerp(this.cur[i], goal[i], f);
    const key = this.cur.map(v => Math.round(v)).join(',');
    if (key !== this.applied) {
      this.applied = key;
      const s = document.documentElement.style;
      s.setProperty('--c', `rgb(${key})`); s.setProperty('--c-rgb', key);
    }
  },
};

/* ═════════ GALÁXIA 3D — câmera fixa, braços em espiral áurea, uma estrela por skill ═════════ */
const ease = {
  out: t => 1 - Math.pow(1 - t, 3),
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
};
const HSL = {
  from(c) {

    if (mx === mn) return [0, 0, l];
    const d = mx - mn, s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    return [(mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4) / 6, s, l];
  },
  to(h, s, l) {
    if (!s) return [l * 255, l * 255, l * 255];
    const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t % 1 + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
  },
};
const hueShift = (c, deg) => { const [h, s, l] = HSL.from(c); return HSL.to(h + deg / 360, s, l); };
const WHITE = [255, 255, 255];
/* Espiral áurea (a espiral de Fibonacci): a cada quarto de volta o raio cresce φ = 1,618.
   Os dois braços da galáxia e as estrelas das skills seguem a mesma curva e giram juntos. */
const PHI = (1 + Math.sqrt(5)) / 2, ENROLA = (Math.PI / 2) / Math.log(PHI), BRACOS = 2;
const espiral = (braco, r) => braco * 2 * Math.PI / BRACOS - Math.log(r / 0.05) * ENROLA;
const NEON = [[0, 229, 255], [176, 102, 255], [255, 64, 214], [255, 226, 46], [60, 255, 150], [255, 146, 40],
  [255, 92, 140], [255, 204, 96], [72, 142, 255], [120, 255, 236], [214, 164, 255], [255, 84, 84]];
const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rnd = (h, k) => { let x = Math.imul(h ^ Math.imul(k + 1, 0x9e3779b9), 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967296; };
/* câmera fixa: inclinação (vista de cima e de frente), giro na tela e distância (perspectiva) */
const CAM = { elev: 0.6, rolagem: -0.4, D: 3.0 };
const M4 = {

const Graph = {
  nodes: [], links: [], byId: new Map(), adj: new Map(), sig: [], arcos: [], faiscas: [], arcAcc: {},

  init(cv, ceu) {

  },

  /* ── estrutura: o núcleo (a luz do Jarvis) e uma estrela por item, distribuídas pelos braços ── */
  setItems(itens, tipo, animar) {

        id: it.id, kind: 'star', item: it, label: it.nome, arm, j,
        u: porBraco > 1 ? j / (porBraco - 1) : .3,
        du: (rnd(h, 1) - .5) * (porBraco > 1 ? .55 / (porBraco - 1) : .1),   // um pouco fora do traço exato, como estrelas reais
        dth: (rnd(h, 2) - .5) * .2, dh: (rnd(h, 9) - .5) * .035,            // e um pouco acima ou abaixo do disco
        size: .25 + .75 * Math.pow(rnd(h, 3), 1.7),                          // tamanhos variados, a maioria pequena

  useSkills(lista) {

  },
  notasItens() {

  add(o) {

  porNome(nome) {

  /* ── geometria: as posições ficam no plano da galáxia; o giro e a perspectiva são da câmera ── */

  /* ── nascimento (boot) ── */

  /* ── raios: nascem sozinhos na bola de plasma, crepitam e somem; ao pensar, acertam as skills ── */

  novoArco(tipo, alvo) {

  /* pesquisando na web ou usando uma ferramenta: uma rajada de raios */
  tempestade(alvo) {

  },
  boltPath(x0, y0, x1, y1, disp, depth) {

  /* ── seleção / tela ── */
  select(n) {

  setMode(m) { this.mode = m; if (m === 'idle' || m === 'listen') this.forca = 1; },   // forca > 1: raciocínio máximo
  setGiro(on) { this.giro = !!on; store.set('jarvis.giro', this.giro); },

  fit() {

    const fovy = 2 * Math.atan(H / (2 * G0 * D));                            // 1 unidade da galáxia ≈ G0 px no centro
    this.VP = M4.mul(M4.persp(fovy, W / H, .05, 30), M4.mul(M4.trans(0, 0, -D), M4.mul(M4.rotZ(CAM.rolagem), M4.rotX(CAM.elev))));
    const [axA, ayA] = this.centroAlvo(), guarda = [this.deslocX, this.desloc];
    this.deslocX = axA / W * 2 - 1; this.desloc = 1 - 2 * ayA / H;          // mede com o centro novo
    const topo = 72, base = H - this.marg.baixo - 8, esq = this.marg.esq + 26, dir = W - this.marg.dir - 26;
    const cabe = r => { for (let i = 0; i < 48; i++) { const a = i / 48 * 6.2832, [x, y] = this.projetar(Math.cos(a) * r, 0, Math.sin(a) * r, true); if (x < esq || x > dir || y < topo || y > base) return false; } return true; };
    let r1 = .62; while (r1 > .08 && !cabe(r1)) r1 -= .01;
    const r0 = Math.min(R * 2.1 / G0, r1 * .6);
    this.geoAlvo = { G0, r0, r1: Math.max(r1, r0 * 1.4), escala: clamp(r1 * G0 / 360, .72, 1), ax: axA, ay: ayA };
    if (!this.geo.G0 || this.geo.G0 !== G0) {                             // primeira vez ou mudou o tamanho da janela: sem animação
      this.geo = { ...this.geoAlvo }; this.ax = axA; this.ay = ayA;
    } else [this.deslocX, this.desloc] = guarda;
  },
  /* muda suavemente quando um painel abre ou fecha */
  acomodar(dt) {
    const a = this.geoAlvo; if (!a) return;
    const f = 1 - Math.exp(-dt * 5);
    this.ax = lerp(this.ax, a.ax, f); this.ay = lerp(this.ay, a.ay, f);
    for (const k of ['r0', 'r1', 'escala']) this.geo[k] = lerp(this.geo[k], a[k], f);

  },
  coreR() { return clamp(Math.min(this.W, this.H) * 0.068, 30, 62); },
  toScreen(n) { return [n.sx, n.sy]; },
  vis(n) { return n.born === Infinity ? 0 : clamp((this.t - n.born) / 650, 0, 1); },
  radius(n) {        // o "R" de cada estrela, como o raio da luz do Jarvis, só que bem menor
    const v = this.vis(n); if (v <= 0) return 0;
    return (2.2 + 4.4 * n.size) * this.geo.escala * (1 + .45 * n.act + (n === this.hover ? .3 : 0)) * ease.back(v);
  },
  hit(x, y) {
    const [cx, cy] = this.anchor();
    if (Math.hypot(x - cx, y - cy) < this.coreR() * 1.15) return this.byId.get('core');
    let best = null, bd = Infinity;
    for (const n of this.nodes) {
      if (n.kind === 'core' || this.vis(n) <= 0) continue;
      const d = Math.hypot(x - n.sx, y - n.sy);
      if (d < Math.max(13, this.radius(n) * n.esc * 2 + 6) && d < bd) { bd = d; best = n; }
    }
    return best;
  },
  bind() {            // sem zoom e sem arrastar: só passar o mouse (nome) e tocar (detalhes)
    const cv = this.cv, pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointermove', e => {
      const [x, y] = pos(e), h = this.hit(x, y);
      if (h !== this.hover) { this.hover = h; cv.style.cursor = h ? 'pointer' : 'default'; UI.tip(h && h.kind !== 'core' ? h : null); }
      if (h) UI.tipMove(e.clientX, e.clientY);
    });
    cv.addEventListener('pointerdown', e => { const [x, y] = pos(e); this.toque = { x, y, alvo: this.hit(x, y) }; });
    cv.addEventListener('pointerup', e => {
      const t = this.toque; this.toque = null; if (!t) return;
      const [x, y] = pos(e); if (Math.hypot(x - t.x, y - t.y) < 14) this.onPick(t.alvo || null);
    });
    cv.addEventListener('pointercancel', () => { this.toque = null; });
    cv.addEventListener('pointerleave', () => { this.hover = null; UI.tip(null); });
  },

  /* ── laço principal: 60 quadros quando está ativo; 30 (ou menos) quando está só girando ── */
  alvoFps() {
    const leve = this.graficos === 'leve' || Ceu.nivel === 'fraco', ativo = this.mode !== 'idle' || this.t - this.birthAt < 4500 || this.hover || this.sel;
    if (ativo) return leve ? 40 : 60;

  },
  medir(ms, alvo) {   // qualidade automática: se o computador não acompanha, desenha com menos pixels
    if (this.graficos !== 'auto' || ms > 400 || alvo > 30 || document.hidden) return;
    if (ms > 1000 / alvo * 1.5) { this.lento++; this.bom = 0; } else { this.lento = Math.max(0, this.lento - .2); this.bom++; }

    } else if (this.bom > 2400 && this.qualidade < 1 && this.t - this.ajusteAt > 90000) {
      this.qualidade = Math.min(1, +(this.qualidade + .06).toFixed(2)); this.ajusteAt = this.t; this.bom = 0; this.resize();
    }
  },
  frame(ts) {

    this.stepSignals(dt);
    const real = this.mode === 'speak' ? Voice.meter() : null;     // nível real da voz Kokoro, quando houver
    const lv = this.mode === 'speak' ? (real != null ? real : 0.45 + 0.55 * Math.abs(Math.sin(ts / 125) * Math.sin(ts / 337 + 1))) : this.mode === 'listen' ? 0.18 : 0;

  },
  /* sem WebGL (raro): um desenho simples em 2D, para nada quebrar */
  desenho2D() {
    const ctx = this.ctx, [cx, cy] = this.anchor(), c = Theme.cur, R = this.coreR();
    ctx.setTransform(this.pr, 0, 0, this.pr, 0, 0); ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#010309'; ctx.fillRect(0, 0, this.W, this.H); this.sujo = true;   // se o WebGL voltar, esta camada é limpa
    ctx.globalCompositeOperation = 'lighter';

    for (const l of this.links) {

      ctx.strokeStyle = rgb(mix(c, WHITE, .3), .1 + .4 * Math.max(l.a.act, l.b.act)); ctx.beginPath();
      for (let i = 0; i <= 10; i++) { const q = this.ponto(l.a, l.b, i / 10), [x, y] = this.projetar(q[0], q[1], q[2]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }
    for (const n of this.estrelas()) {
      const r = this.radius(n) * n.esc * 3; if (r <= 0) continue;
      const g = ctx.createRadialGradient(n.sx, n.sy, 0, n.sx, n.sy, r);
      g.addColorStop(0, rgb(WHITE, .95)); g.addColorStop(.2, rgb(n.color, .55)); g.addColorStop(1, rgb(n.color, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.sx, n.sy, r, 0, 6.283); ctx.fill();
    }
    const luz = this.birthAt < 0 ? .3 : 1, g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 3.5);
    g.addColorStop(0, rgb(WHITE, luz)); g.addColorStop(.25, rgb(c, .7 * luz)); g.addColorStop(1, rgb(c, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 3.5, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
  },
};

const GL_PROJ = `
uniform mat4 uVP; uniform float uGiro; uniform vec2 uDesloc;
vec4 projeta(vec3 p) {

  q.xy += uDesloc * q.w;

  vec4 q = projeta(vec3(cos(aA.y) * aA.x, aA.z, sin(aA.y) * aA.x));

  /* estrelas do fundo, fixas na tela */
  fundo: [`attribute vec4 aA; attribute vec4 aB;
uniform float uT, uPr; varying vec4 vCor; varying float vGrande;

  /* sinapses: curvas que seguem a espiral */
  lin: [`attribute vec3 aP; attribute vec4 aC; varying vec4 vC;${GL_PROJ}
void main() { gl_Position = projeta(aP); vC = aC; }`,
  `${GL_FRAG}varying vec4 vC; void main() { gl_FragColor = vec4(vC.rgb * vC.a, 1.0); }`],
  /* cada skill é uma luz do Jarvis em miniatura: halo, brilho, pontas de difração, reflexo e núcleo branco */
  est: [`attribute vec3 aP; attribute vec4 aT; attribute vec3 aC1; attribute vec3 aC2; attribute vec4 aE;

  `${GL_FRAG}varying vec4 vC;
void main() {
  vec2 q = gl_PointCoord * 2.0 - 1.0; float d2 = dot(q, q);

  /* a bola de plasma: esfera girando, filamentos elétricos, corona, tentáculos, reflexo e pontas */

const Ceu = {
  ok: false, gl: null, nivel: 'normal', prog: {}, buf: {}, ligados: [], maxPt: 64, n: {},
  init(cv, graficos) {
    this.cv = cv;
    try { this.gl = cv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false }); } catch {}
    if (!this.gl) { cv.style.display = 'none'; return; }
    cv.addEventListener('webglcontextlost', e => { e.preventDefault(); this.ok = false; Graph.sujo = true; });
    cv.addEventListener('webglcontextrestored', () => this.preparar(Graph.graficos));
    this.preparar(graficos);
  },
  preparar(graficos) {
    const gl = this.gl;
    try {
      this.maxPt = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1] || 64;
      const ext = gl.getExtension('WEBGL_debug_renderer_info'), placa = ext ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)) : '';
      this.software = /swiftshader|llvmpipe|software|basic render/i.test(placa);
      this.antiga = /intel.*(hd graphics( [234]\d{3}| family)?\b|gma)/i.test(placa) && !/(uhd|iris)/i.test(placa);
      this.prog = {}; this.buf = {}; this.ligados = [];
      for (const k in SHADERS) this.prog[k] = this.compilar(...SHADERS[k]);
      for (const k of ['gal', 'fundo', 'lin', 'est', 'sin', 'quad']) this.buf[k] = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, this.buf.quad); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      this.reconfigurar(graficos);
      this.ok = true;
    } catch (e) { console.warn('Jarvis: WebGL indisponível, usando o desenho simples.', e); this.ok = false; this.cv.style.display = 'none'; }
  },
  compilar(vs, fs) {
    const gl = this.gl, p = gl.createProgram();

/* ═════════ ÁUDIO — efeitos de mago: mais grave, timbre escuro e eco de catedral ═════════ */
const FX = {
  ctx: null, input: null, wet: null, an: null, buf: null,
  ensure() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    const ctx = this.ctx = new AC();
    const input = this.input = ctx.createGain();
    const low = ctx.createBiquadFilter(); low.type = 'lowshelf'; low.frequency.value = 180; low.gain.value = 5;
    const mid = ctx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 2800; mid.Q.value = .9; mid.gain.value = -2.5;
    const high = ctx.createBiquadFilter(); high.type = 'highshelf'; high.frequency.value = 7000; high.gain.value = -5;
    const dry = ctx.createGain(); dry.gain.value = .9;
    const pre = ctx.createDelay(1); pre.delayTime.value = .035;
    const conv = ctx.createConvolver(); conv.buffer = this.impulse(ctx, 3.2, 2.6);
    const wet = this.wet = ctx.createGain(); wet.gain.value = Voice.eco();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = .005; comp.release.value = .25;
    const an = this.an = ctx.createAnalyser(); an.fftSize = 1024; this.buf = new Float32Array(an.fftSize);
    input.connect(low); low.connect(mid); mid.connect(high);
    high.connect(dry); dry.connect(comp);
    high.connect(pre); pre.connect(conv); conv.connect(wet); wet.connect(comp);
    comp.connect(an); an.connect(ctx.destination);
    return ctx;
  },
  /* resposta de sala gerada na hora: ruído com decaimento, sem arquivos externos */
  impulse(ctx, secs, decay) {
    const rate = ctx.sampleRate, len = Math.floor(rate * secs), b = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay) * Math.min(1, i / (rate * .02));
    }
    return b;
  },
  unlock() { const c = this.ensure(); if (c && c.state === 'suspended') c.resume().catch(() => {}); },
  setEco(v) { if (this.wet) this.wet.gain.setTargetAtTime(v, this.ctx.currentTime, .05); },
  level() {
    if (!this.an) return 0;
    this.an.getFloatTimeDomainData(this.buf);
    let s = 0; for (let i = 0; i < this.buf.length; i++) s += this.buf[i] * this.buf[i];
    return Math.sqrt(s / this.buf.length);
  },
};

const Skills = {
  lista: [],

      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3000);
      const l = await (await fetch(CONFIG.local.url + '/skills', { signal: ctl.signal })).json();

  },
  descricao(s) { return SKILL_PT[String(s.nome).toLowerCase()] || s.descricao || 'Skill instalada no seu Claude Code.'; },
  /* skills ligadas a um pedido ("cria uma planilha" → xlsx), para acender a estrela certa */
  buscar(texto, limite = 3) {
    const vagas = new Set(['skill', 'skills', 'cria', 'criar', 'crie', 'edita', 'editar', 'faz', 'fazer', 'claude', 'code', 'usa', 'usar', 'jarvis', 'monta', 'montar', 'monte', 'gera', 'gerar', 'gere', 'transforma', 'transformar', 'preciso', 'quero']);
    const q = tokens(texto).filter(w => !vagas.has(w)); if (!q.length) return [];
    const igual = (w, x) => x === w || (w.length >= 5 && x.length >= 5 && x.slice(0, 5) === w.slice(0, 5));
    const ach = this.lista.map(s => {
      const nome = tokens(s.nome.replace(/[-/_]/g, ' ')), tk = tokens(this.descricao(s)).filter(w => !vagas.has(w));
      let p = 0; for (const w of q) p += nome.some(x => igual(w, x)) ? 2 : tk.some(x => igual(w, x)) ? 1 : 0;   // o nome da skill pesa mais
      return [s.id, p];

const Kokoro = {
  ok: false, falhas: 0, rtf: 0, n: 0, lento: false, lentidao: 0,
  async probe() { await Local.probe(); return this.ok; },
  async synth(text, voz, signal) {
    const ctx = FX.ensure(); if (!ctx) throw new Error('este navegador não tem Web Audio');
    const r = await fetch(CONFIG.local.url + '/tts', {
      method: 'POST', signal, headers: { 'content-type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify({ texto: text, voz: voz || Voice.kvoz(), velocidade: +clamp(Voice.kvel() / Voice.grave(), 0.5, 1.6).toFixed(2) }),
    });
    if (!r.ok) throw new Error('Kokoro respondeu ' + r.status);
    const seg = parseFloat(r.headers.get('x-sintese') || ''), buf = await ctx.decodeAudioData(await r.arrayBuffer());
    if (seg > 0) this.amostra(seg, buf.duration / Voice.grave());
    return buf;
  },
  /* quanto tempo o computador leva para gerar cada segundo de fala */
  amostra(seg, dur) {
    if (dur < .5) return;
    const k = seg / dur; this.rtf = this.n ? this.rtf * .7 + k * .3 : k; this.n++;
    if (this.n >= 3 && this.rtf > 1.25 && !this.lento && !this.paciente()) this.ficouLento('O Kokoro está gerando a voz mais devagar do que ela é falada neste computador');
  },
  ficouLento(motivo) {
    this.lento = true;
    UI.say('sys', `${motivo}, então troquei para ${Voice.nomeReserva()} para você não ficar esperando. Para tentar a voz de mago de novo, diga: Jarvis, voz de mago.`);
  },
  reiniciar() { this.lento = false; this.lentidao = 0; this.n = 0; this.rtf = 0; this.falhas = 0; },
  paciente() { return store.get('jarvis.kokoro.paciente', false); },
  rapida() { return !!(Local.info && Local.info.motor_voz === 'onnx'); },
  /* primeira vez com a voz rápida: o servidor baixa o modelo (uns 190 MB). Mostra o andamento no painel
     e, quando ela fica pronta, volta para a voz de mago mesmo que a sessão tenha caído na voz do navegador. */
  aguardar() {
    if (this.espera) return;
    const andamento = () => Avisos.trocar('voz-rapida', { tipo: 'sistema', titulo: 'Preparando a voz de mago rápida',
      texto: `Baixando o modelo da voz, só na primeira vez (uns 190 MB): ${Local.progresso}%. Enquanto isso, uso ${Voice.nomeReserva()}. Eu aviso aqui quando ficar pronta.` });
    andamento();
    this.espera = setInterval(async () => {
      await Local.probe();
      if (Local.ok && (Local.vozPreparando || Local.rapidaPreparando)) return andamento();
      if (!Local.ok) return;                                       // servidor reiniciando: tenta de novo na próxima
      clearInterval(this.espera); this.espera = null;
      if (this.ok && this.rapida()) {
        this.reiniciar();
        const escolheu = Voice.engine() !== 'kokoro';                    // você está com outra voz: só avisa
        Avisos.trocar('voz-rapida', { tipo: 'dica', titulo: 'Voz de mago rápida pronta', texto: escolheu
          ? 'A voz de mago agora roda no modo rápido, no processador. Para usá-la, diga: Jarvis, voz de mago.'
          : 'A voz de mago agora roda no modo rápido, no processador. É ela que vou usar daqui em diante.' });
      } else this.semRapida();
    }, 5000);
  },
  /* o download da voz rápida não deu certo (sem internet, por exemplo): explica no painel */
  semRapida() {
    Avisos.trocar('voz-rapida', { tipo: 'alerta', titulo: 'Voz de mago rápida', texto:
      `Não consegui baixar a voz rápida${Local.erroRapida ? ' (' + Local.erroRapida + ')' : ''}. ` +
      (this.ok ? 'Sigo com a voz de mago normal.' : 'Sigo com a voz do navegador.') + ' Confira a internet e feche e abra o Jarvis para tentar de novo.' });
  },
  falhou(err) {
    this.falhas++;                                  // servidor fora do ar: desliga na hora; outros erros: na segunda vez
    if ((err instanceof TypeError || this.falhas >= 2) && this.ok) {
      this.ok = false;
      UI.say('sys', 'A voz de mago (Kokoro) parou de responder, então voltei para a voz do navegador. Com o servidor do Jarvis aberto, diga “Jarvis, voz de mago” para reconectar.');
    }
  },
  nome(id) { const v = KOKORO_VOZES.find(x => x.id === id); return v ? v.nome : id.replace(/,/g, ' + '); },
};

/* ═════════ VOZ — Kokoro quando disponível; senão a voz do navegador ═════════ */
const Voice = {
  ok: 'speechSynthesis' in window, list: [], voice: null, male: false,
  queue: [], busy: false, ended: true, muted: store.get('jarvis.mudo', false),
  cur: null, src: null, playing: false, wd: 0, gapT: 0, tok: 0,
  pref: store.get('jarvis.voz.v1', {}),     // ajustes feitos por comando de voz
  init() {
    if (!this.ok) return;
    let tentativas = 0;
    const load = () => {
      const todas = speechSynthesis.getVoices() || [];
      // Edge 150 às vezes entrega vozes quebradas ("Microsoft undefined Online (Natural) - undefined"): descarta e pede de novo
      this.list = todas.filter(v => v && v.name && !/undefined/i.test(v.name + ' ' + v.lang));
      if (this.list.length < todas.length && tentativas++ < 5) setTimeout(load, 1500);
      this.choose();
    };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch { speechSynthesis.onvoiceschanged = load; }
  },
  isMale(v) { return /antonio|ant[oô]nio|daniel|felipe|ricardo|thiago|donato|fabio|f[aá]bio|julio|j[uú]lio|humberto|nicolau|valerio|male|masculin/i.test(v.name + ' ' + v.voiceURI); },
  /* voz natural da Microsoft (Edge): gerada na nuvem, então não gasta o processador do notebook */
  natural(v) { return !!v && /natural/i.test(v.name) && (v.localService === false || /online/i.test(v.name)); },
  nuvem() { return this.natural(this.voice); },
  melhorNatural() { return this.pt().find(v => this.natural(v)) || null; },
  melhorLocal() { return this.pt().find(v => !this.natural(v) && this.score(v) > 0) || null; },
  nomeReserva() { return this.nuvem() ? 'a voz natural ' + this.short(this.voice) : 'a voz do navegador'; },
  score(v) {
    const lang = (v.lang || '').replace('_', '-').toLowerCase();
    let s = lang === 'pt-br' ? 60 : lang.startsWith('pt') ? 25 : -999;
    if (this.isMale(v)) s += 40;
    if (this.natural(v)) s += 30;
    else if (/natural|neural|online|premium|enhanced/i.test(v.name)) s += 12;
    if (/francisca|maria|luciana|vit[oó]ria|helena|fernanda|camila|thalita|brenda|leila|manuela|yara|female|feminin/i.test(v.name)) s -= 30;
    return s;
  },
  pt() { return this.list.filter(v => this.score(v) > -999).sort((a, b) => this.score(b) - this.score(a)); },
  choose() {
    const saved = this.pref.name && this.list.find(v => v.name === this.pref.name);
    this.voice = saved || this.pt().filter(v => this.score(v) > 0)[0] || null;
    this.male = !!this.voice && this.isMale(this.voice);
  },
  short(v) { return /google/i.test(v.name) ? 'Google' : v.name.replace(/^Microsoft\s+/, '').replace(/\s*[-–(].*$/, '').replace(/\s+Online$/, '') || v.name; },
  label() { return this.voice ? this.short(this.voice) : 'padrão do navegador'; },
  /* qual voz fala: a que você escolheu por comando; sem escolha, a natural da nuvem quando existe (não usa o processador),
     senão a voz de mago. Se o Kokoro estiver fora ou lento, sempre a do navegador. */
  engine() {
    const m = this.pref.motor;
    if (m === 'navegador' || !Kokoro.ok || Kokoro.lento) return 'navegador';
    if (m === 'kokoro') return 'kokoro';
    return this.nuvem() ? 'navegador' : 'kokoro';
  },
  pitch() { return this.pref.pitch != null ? this.pref.pitch : this.nuvem() ? CONFIG.voz.pitchNatural : this.male ? CONFIG.voz.pitch : CONFIG.voz.pitchOutras; },
  rate() { return this.pref.rate != null ? this.pref.rate : CONFIG.voz.rate; },
  kvoz() { return this.pref.kvoz || CONFIG.kokoro.voz; },
  kvel() { return this.pref.kvel != null ? this.pref.kvel : CONFIG.kokoro.velocidade; },
  grave() { return this.pref.grave != null ? this.pref.grave : CONFIG.kokoro.grave; },
  eco() { return this.pref.eco != null ? this.pref.eco : CONFIG.kokoro.eco; },
  save() { store.set('jarvis.voz.v1', this.pref); },
  set(k, v) { this.pref[k] = v; this.save(); if (k === 'eco') FX.setEco(v); },
  use(v) { this.voice = v; this.male = this.isMale(v); this.pref.name = v.name; this.save(); return v; },
  cycle() { const l = this.pt(); if (l.length < 2) return null; return this.use(l[(l.indexOf(this.voice) + 1) % l.length]); },
  find(q) { const k = norm(q).trim(); return this.pt().find(v => norm(this.short(v)).includes(k) || norm(v.name).includes(k)); },
  adjust(dp, dr) {
    if (dp) this.pref.pitch = +clamp(this.pitch() + dp, 0.1, 1.6).toFixed(2);
    if (dr) this.pref.rate = +clamp(this.rate() + dr, 0.6, 1.5).toFixed(2);
    this.save();
  },
  reset() { this.pref = {}; this.save(); this.choose(); FX.setEco(this.eco()); },
  meter() { return this.playing ? clamp(FX.level() * 5, 0, 1) : null; },
  clean(t) {
    return String(t)
      .replace(/```[\s\S]*?```/g, ' ').replace(/https?:\/\/\S+/g, 'o link')
      .replace(/R\$\s?([\d.,]+)/g, '$1 reais').replace(/(\d)\s?%/g, '$1 por cento')
      .replace(/[*_#`~>|•]+/g, ' ').replace(/\s*&\s*/g, ' e ')
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
      .replace(/\s+/g, ' ').trim();
  },
  say(text, voz) {
    const t = this.clean(text); if (!t) return;
    if (this.ended && !this.busy && !this.queue.length) { this.grupoNav = false; this.primeira = true; }   // começo de uma resposta nova
    this.ended = false;
    const item = { text: t, audio: null, voz, ctl: null };
    if (!this.muted && this.engine() === 'kokoro' && !this.grupoNav) {         // já pede o áudio: menos espera entre frases
      item.ctl = new AbortController();
      item.audio = Kokoro.synth(t, typeof voz === 'string' ? voz : null, item.ctl.signal); item.audio.catch(() => {});
    }
    this.queue.push(item); this.pump();
  },
  /* o Kokoro não ficou pronto a tempo: esta frase e o resto da resposta saem pela voz do navegador (nunca em silêncio) */
  demorou(item, done) {
    item.trocado = true; this.grupoNav = true;
    for (const q of [item, ...this.queue]) { if (q.ctl) try { q.ctl.abort(); } catch {} q.audio = null; }
    if (++Kokoro.lentidao >= 2 && !Kokoro.lento && !Kokoro.paciente()) Kokoro.ficouLento('A voz de mago demorou demais para ficar pronta');
    this.browser(item.text, done, item.voz);
  },
  finish() { this.ended = true; this.check(); },
  pump() {
    if (this.busy || !this.queue.length) return;
    clearTimeout(this.gapT);
    const item = this.queue.shift(), tok = ++this.tok, primeira = this.primeira;
    this.falado = [...this.falado.slice(-7), { t: item.text, q: performance.now() }];
    this.atual = item; this.primeira = false;
    this.busy = true; App.speaking(true);
    const done = () => {
      if (tok !== this.tok) return;                 // ignora avisos atrasados de falas canceladas
      this.tok++; clearTimeout(this.wd);
      this.busy = false; this.cur = null; this.src = null; this.playing = false;
      if (this.queue.length) this.gapT = setTimeout(() => this.pump(), this.engine() === 'kokoro' ? 40 : CONFIG.voz.pausa);   // pausa curta entre frases
      else this.check();
    };
    if (this.muted) { this.wd = setTimeout(done, clamp(300 + item.text.length * 16, 400, 2600)); return; }
    if (item.audio) {
      const paciencia = Kokoro.paciente() ? [14000, 11000] : [6500, 5000];                            // você pediu a voz de mago: espera mais por ela
      this.wd = setTimeout(() => { if (tok === this.tok) this.demorou(item, done); }, primeira ? paciencia[0] : paciencia[1]);   // vigia: Kokoro lento ou travado
      item.audio
        .then(buf => { if (tok !== this.tok || item.trocado) return; Kokoro.falhas = 0; this.play(buf, done, item); })
        .catch(err => { if (tok !== this.tok || item.trocado || err.name === 'AbortError') return; Kokoro.falhou(err); this.browser(item.text, done, item.voz); });
      return;
    }
    this.browser(item.text, done, item.voz);
  },
  play(buf, done, item) {
    clearTimeout(this.wd);
    if (FX.ctx.state !== 'running') {               // áudio do navegador suspenso (troca de fone, Windows dormiu...)
      const tok = this.tok;
      FX.ctx.resume().catch(() => {});
      this.wd = setTimeout(() => { if (tok !== this.tok) return; FX.ctx.state === 'running' ? this.tocar(buf, done) : this.browser(item ? item.text : '', done); }, 400);
      return;
    }
    this.tocar(buf, done);
  },
  tocar(buf, done) {
    clearTimeout(this.wd);
    const src = FX.ctx.createBufferSource();
    src.buffer = buf; src.playbackRate.value = this.grave();      // abaixo de 1: mais grave e mais solene
    src.connect(FX.input); src.onended = done;
    this.src = src; this.playing = true;
    this.wd = setTimeout(done, buf.duration / src.playbackRate.value * 1000 + 3000);
    src.start();
  },
  browser(text, done, outra) {
    clearTimeout(this.wd);
    if (!this.ok) { this.wd = setTimeout(done, clamp(300 + text.length * 16, 400, 2600)); return; }
    const u = new SpeechSynthesisUtterance(text);
    this.cur = u;                                  // mantém referência: evita o Chrome perder o onend
    const v = outra && typeof outra === 'object' ? outra : this.voice;
    u.lang = CONFIG.voz.lang; if (v) u.voice = v;
    u.rate = this.rate(); u.pitch = this.pitch(); u.volume = 1;
    u.onend = () => { if (this.natural(v)) this.falhasNuvem = 0; done(); };
    u.onerror = e => {
      const k = e && e.error;
      if (this.cur !== u || k === 'interrupted' || k === 'canceled' || !this.natural(v)) return done();
      // a voz natural depende da internet: se ela falhar, esta frase sai pela voz do próprio Windows (nunca em silêncio)
      const local = this.melhorLocal();
      if (++this.falhasNuvem >= 2 && local && this.voice === v) {
        this.voice = local; this.male = this.isMale(local);
        const agora = this.engine() === 'kokoro' ? 'a voz de mago, que roda aqui no computador' : `a voz ${this.short(local)}, do Windows`;
        UI.say('sys', `A voz natural ${this.short(v)} não respondeu (a internet caiu?), então passei para ${agora}. Para voltar, diga: Jarvis, voz natural.`);
      }
      if (local) this.browser(text, done, local); else done();
    };
    this.wd = setTimeout(done, 5000 + text.length * 130);
    try { speechSynthesis.speak(u); } catch { done(); }
  },
  falhasNuvem: 0,
  check() { if (this.ended && !this.busy && !this.queue.length) { this.fimFala = performance.now(); App.speaking(false); } },
  /* o microfone ouviu o próprio Jarvis falando? (alto-falante do notebook perto do microfone) */
  falado: [], fimFala: -1e9,
  eco(texto) {
    const agora = performance.now();
    if (!this.busy && agora - this.fimFala > 3500) return false;
    const a = tokens(texto); if (a.length < 2) return false;
    const b = new Set(tokens(this.falado.filter(x => agora - x.q < 40000).map(x => x.t).join(' ')));
    return a.filter(w => b.has(w)).length / a.length >= .5;
  },
  cancel() {
    for (const q of [this.atual, ...this.queue]) if (q && q.ctl) try { q.ctl.abort(); } catch {}   // o servidor não gasta tempo com o que não vai ser falado
    this.tok++; this.queue.length = 0; this.ended = true; this.busy = false; this.cur = null; this.playing = false; this.atual = null;
    clearTimeout(this.wd); clearTimeout(this.gapT);
    if (this.src) { try { this.src.onended = null; this.src.stop(); } catch {} this.src = null; }
    if (this.ok) try { speechSynthesis.cancel(); } catch {}
  },
  setMuted(m) {
    this.muted = m; store.set('jarvis.mudo', m);
    if (m) { if (this.ok) try { speechSynthesis.cancel(); } catch {} if (this.src) try { this.src.stop(); } catch {} }
  },
};

/* comandos para ajustar a própria voz — resolvidos aqui, sem gastar a API */
const voiceCommand = text => {
  const t = norm(text).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  if (!/\b(voz|vozes|tom|grave|agud[oa]|fin[oa]|devagar|lent[oa]|arrastad[oa]|pausad[oa]|rapid[oa]|acelerad[oa]|depressa|eco|kokoro|mago)\b/.test(t)) return null;
  const k = Voice.engine() === 'kokoro';
  const sobreVoz = /\b(voz|tom|fala|fale|falar)\b/.test(t) || t.split(' ').length <= 3;
  if (sobreVoz && !/\bmais\b/.test(t)) {                         // reclamações: corrige no sentido contrário
    if (/\b(lent[oa]|arrastad[oa]|devagar demais|muito devagar)\b/.test(t)) { if (k) Voice.set('kvel', +clamp(Voice.kvel() + .1, .6, 1.5).toFixed(2)); else Voice.adjust(0, 0.1); return 'Entendido. Vou falar mais rápido.'; }
    if (/\b(rapid[oa] demais|muito rapid[oa]|acelerad[oa])\b/.test(t)) { if (k) Voice.set('kvel', +clamp(Voice.kvel() - .08, .6, 1.5).toFixed(2)); else Voice.adjust(0, -0.08); return 'Certo. Vou falar com mais calma.'; }
    if (/\b(fina|aguda|agudo|fino)\b/.test(t)) { if (k) Voice.set('grave', +clamp(Voice.grave() - .04, .72, 1.1).toFixed(2)); else Voice.adjust(-0.1, 0); return 'Ajustado, senhor. Um tom mais grave.'; }
    if (/\b(grave demais|grossa demais|muito grave)\b/.test(t)) { if (k) Voice.set('grave', +clamp(Voice.grave() + .04, .72, 1.1).toFixed(2)); else Voice.adjust(0.1, 0); return 'Ajustado. Um tom um pouco mais leve.'; }
  }
  const soKokoro = 'O eco só funciona com a voz Kokoro. Diga “Jarvis, voz de mago” para ativá-la.';

  if (/\bvoz (natural|da microsoft|online|da nuvem|do edge|do antonio)\b/.test(t)) {
    const v = Voice.melhorNatural();
    if (!v) return /\bEdg\//.test(navigator.userAgent)
      ? 'Não encontrei a voz natural neste Edge agora. Confira a internet e abra o Jarvis de novo.'
      : 'A voz natural da Microsoft só existe no navegador Edge. Abra o Jarvis pelo ícone da área de trabalho, que ele já abre no Edge.';
    Voice.use(v); Voice.set('motor', 'navegador'); store.set('jarvis.kokoro.paciente', false); Voice.falhasNuvem = 0;
    return `Voz natural ${Voice.short(v)} ativada. Ela é gerada na nuvem da Microsoft, sem usar o processador do notebook.`;
  }
  if (/\bvoz do navegador\b|\b(desliga|desligar|sem) (a )?(voz )?kokoro\b/.test(t)) { Voice.set('motor', 'navegador'); store.set('jarvis.kokoro.paciente', false); return 'Certo, voltei para a voz do navegador.'; }
  if (/\bvoz (de |do )?mago\b|\bkokoro\b|\bvoz neural\b/.test(t)) {
    return Kokoro.probe().then(ok => {
      if (!ok) {
        if (Local.vozPreparando) {                                   // fica escolhida: entra sozinha quando o download terminar
          store.set('jarvis.kokoro.paciente', true); Voice.set('motor', 'kokoro'); Kokoro.aguardar();
          return `A voz de mago rápida ainda está sendo preparada, ${Local.progresso} por cento baixado. Eu aviso no painel quando ficar pronta.`;
        }
        if (Local.ok && Local.erroRapida) { Kokoro.semRapida(); return 'Não consegui baixar a voz de mago rápida, senhor. Deixei o motivo no painel. Confira a internet e abra o Jarvis de novo.'; }
        return 'Não encontrei a voz de mago neste computador. Abra o Jarvis pelo ícone da área de trabalho e peça de novo.';
      }
      Kokoro.reiniciar(); store.set('jarvis.kokoro.paciente', true); Voice.set('motor', 'kokoro');
      if (/\bmago\b/.test(t)) Voice.set('kvoz', KOKORO_VOZES[0].id);
      return `Voz ${Kokoro.nome(Voice.kvoz())} ativada. É assim que falarei daqui em diante, ${CONFIG.usuario}.`;
    });
  }
  if (/\b(lista|listar|liste|quais|mostra|mostrar|mostre)\b.*\bvozes\b/.test(t)) {
    if (k) {
      UI.say('sys', 'Vozes Kokoro: ' + KOKORO_VOZES.map(v => `${v.nome} (${v.id.replace(',', ' + ')})`).join(', ') + '. Diga “Jarvis, usa a voz” e o nome.');
      return `Tenho ${KOKORO_VOZES.length} vozes Kokoro preparadas, senhor. Deixei a lista na tela.`;
    }
    const l = Voice.pt();
    if (!l.length) return 'Este navegador não oferece vozes em português. Para a voz de mago, rode o jarvis_kokoro.py.';
    UI.say('sys', 'Vozes em português neste navegador: ' + l.map(v => Voice.short(v)).join(', ') + '. Diga “Jarvis, usa a voz” e o nome.');
    return `Encontrei ${l.length} ${l.length === 1 ? 'voz' : 'vozes'} em português, senhor. Deixei os nomes na tela.`;
  }
  if (/\bmais eco\b|\b(aumenta|aumentar|aumente) (o )?eco\b/.test(t)) {
    if (!k) return soKokoro;
    Voice.set('eco', +clamp(Voice.eco() + .1, 0, .8).toFixed(2)); return 'Mais eco. Como numa catedral, senhor.';
  }
  if (/\bmenos eco\b|\bsem eco\b|\b(diminui|diminuir|diminua|tira|tirar|tire) (o )?eco\b/.test(t)) {
    if (!k) return soKokoro;
    Voice.set('eco', /\bsem eco\b|\bti(ra|rar|re)\b/.test(t) ? 0 : +clamp(Voice.eco() - .1, 0, .8).toFixed(2)); return 'Eco reduzido.';
  }
  if (sobreVoz && /\bmais grave\b|\bengrossa\b|\bmais (profunda|grossa)\b|\bmenos agud/.test(t)) {
    if (k) Voice.set('grave', +clamp(Voice.grave() - .04, .72, 1.1).toFixed(2)); else Voice.adjust(-0.1, 0);
    return pick([`Tom mais grave. Assim soa melhor, ${CONFIG.usuario}?`, `Ajustado, ${CONFIG.formal}. Um registro mais profundo.`]);
  }
  if (sobreVoz && /\bmais agud|\bmais fina\b|\bmenos grave\b/.test(t)) {
    if (k) Voice.set('grave', +clamp(Voice.grave() + .04, .72, 1.1).toFixed(2)); else Voice.adjust(0.1, 0);
    return 'Tom um pouco mais agudo. Melhor assim?';
  }
  if (/^(?:(?:fala|fale|voz|vai)\s+)?mais (?:devagar|lento|lenta|pausado|pausada)$|\b(?:fala|fale|voz)\b.*\bmais (?:devagar|lent|pausad)/.test(t)) {
    if (k) Voice.set('kvel', +clamp(Voice.kvel() - .06, .6, 1.3).toFixed(2)); else Voice.adjust(0, -0.07);
    return 'Certo. Vou falar com mais calma.';
  }
  if (/^(?:(?:fala|fale|voz|vai)\s+)?mais (?:rapido|rapida|depressa)$|\b(?:fala|fale|voz)\b.*\bmais (?:rapid|depressa)/.test(t)) {
    if (k) Voice.set('kvel', +clamp(Voice.kvel() + .06, .6, 1.3).toFixed(2)); else Voice.adjust(0, 0.07);
    return 'Entendido. Um pouco mais rápido.';
  }
  if (/\b(voz|tom)\b.*\b(padrao|original|normal)\b|\b(reseta|resetar|restaura|restaurar|volta)\b.*\bvoz\b/.test(t)) { Voice.reset(); return 'Voz restaurada ao padrão, senhor.'; }
  const m = t.match(/\b(?:usa|use|usar|escolhe|escolha|coloca|coloque|quero)\s+(?:a\s+)?voz\s+(?:d[oa]\s+)?([a-z0-9 ]{2,})$/);
  if (m) {
    const q = m[1].trim();
    if (k) {
      const v = KOKORO_VOZES.find(x => norm(x.nome) === q) || KOKORO_VOZES.find(x => norm(x.nome).includes(q) || x.id.replace(/[_,]/g, ' ').includes(q));
      if (v) { Voice.set('kvoz', v.id); return `Voz ${v.nome} ativada. Assim está bom, ${CONFIG.usuario}?`; }
    }
    const v = Voice.find(q);
    if (v) { Voice.use(v); if (k) Voice.set('motor', 'navegador'); return `Voz ${Voice.short(v)} ativada. Assim está bom, ${CONFIG.usuario}?`; }
    return `Não encontrei a voz ${q}. Diga “Jarvis, lista as vozes” para ver as opções.`;
  }
  if (/\b(troca|trocar|troque|muda|mudar|mude|alterna|alternar|proxima|outra)\b.*\bvoz\b|\bvoz\b.*\b(proxima|seguinte|outra)\b/.test(t)) {
    if (k) {
      const i = KOKORO_VOZES.findIndex(v => v.id === Voice.kvoz()), v = KOKORO_VOZES[(i + 1) % KOKORO_VOZES.length];
      Voice.set('kvoz', v.id); return `Esta é a voz ${v.nome}. Prefere esta, senhor?`;
    }
    const v = Voice.cycle();
    return v ? `Esta é a voz ${Voice.short(v)}. Prefere esta, senhor?` : 'Este navegador só oferece uma voz em português. Para a voz de mago, rode o jarvis_kokoro.py.';
  }
  return null;
};

/* ═════════ OUVIDO — reconhecimento contínuo com a palavra "Jarvis" e um vigia que religa o microfone ═════════ */
const Ear = {
  SR: window.SpeechRecognition || window.webkitSpeechRecognition,
  rec: null, ok: false, want: false, run: false, hold: false, denied: false,
  fails: 0, startedAt: 0, endedAt: 0, audioAt: 0, recriados: 0,
  init() {
    if (!this.SR || !this._make()) return;
    this.ok = true;
    setInterval(() => this._vigia(), 2000);
  },
  _make() {
    try { this.rec = new this.SR(); } catch { return false; }
    const r = this.rec;
    r.lang = CONFIG.voz.lang; r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    r.onstart = () => { if (r !== this.rec) return; this.run = true; this.startedAt = performance.now(); UI.mic(); };
    r.onaudiostart = () => { if (r === this.rec) { this.audioAt = performance.now(); this.capFails = 0; } };
    r.onend = () => {
      if (r !== this.rec) return;
      this.run = false; this.endedAt = performance.now(); UI.mic();
      if (performance.now() - this.startedAt < 1200) this.fails++; else this.fails = 0;
      if (this.want && !this.hold) setTimeout(() => this._go(), this.fails > 4 ? 4000 : 300);
    };
    r.onerror = e => {
      if (r !== this.rec) return;
      const k = e.error;
      if (k === 'not-allowed' || k === 'service-not-allowed') { this.want = false; this.denied = true; UI.mic(); if (!EMBUTIDO) UI.say('sys', 'O microfone foi bloqueado. Libere o acesso nas permissões do site e clique no ícone do microfone, ou converse digitando.'); }
      else if (k === 'audio-capture') {
        this.capFails = (this.capFails || 0) + 1;
        if (this.capFails <= 3) return;                      // falha passageira: o onend tenta de novo
        this.want = false; UI.mic();
        UI.say('sys', 'Não consegui usar o microfone. No Windows, abra Configurações, Privacidade e segurança, Microfone, e libere o acesso para apps da área de trabalho. Depois clique no ícone do microfone aqui.');
      }
      else if (k === 'network' && this.fails === 3) UI.say('sys', 'O reconhecimento de voz perdeu a conexão com o serviço do navegador. Tentando de novo.');
    };
    r.onresult = e => {
      if (r !== this.rec) return;
      this.audioAt = performance.now();
      let interim = '', fin = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i], tx = res[0].transcript;
        res.isFinal ? (fin += tx + ' ') : (interim += tx);
      }
      if (interim) App.interim(interim.trim());
      if (fin.trim()) { App.interim(''); App.heard(fin.trim()); }
    };
    return true;
  },
  /* vigia: o Chrome às vezes para de ouvir sem avisar; aí o reconhecedor é recriado em poucos segundos */
  _vigia() {
    if (!this.ok || !this.want || this.hold || this.denied) return;
    const agora = performance.now();
    const parado = !this.run && agora - this.endedAt > 3000 && agora - this.startedAt > 3000;
    const surdo = this.run && this.audioAt < this.startedAt && agora - this.startedAt > 4000;
    if (parado || surdo) this._recriar();
  },
  _recriar() {
    const velho = this.rec;
    if (!this._make()) return;
    this.recriados++;
    try { velho && velho.abort(); } catch {}
    this.run = false; this.fails = 0; this.startedAt = this.endedAt = performance.now();
    setTimeout(() => this._go(), 250);
  },
  start() { if (!this.ok) return false; this.denied = false; this.want = true; this._go(); UI.mic(); return true; },
  stop() { this.want = false; try { this.rec && this.rec.abort(); } catch {} UI.mic(); },
  pause() { this.hold = true; if (this.run) try { this.rec.abort(); } catch {} },
  resume() { this.hold = false; this.endedAt = performance.now(); if (this.want) setTimeout(() => this._go(), 220); },
  _go() { if (!this.ok || !this.want || this.hold || this.run) return; try { this.rec.start(); } catch {} },
};

/* palavra de ativação: qualquer frase com "Jarvis" (com as variações que o reconhecedor costuma ouvir) */
const WAKE_SRC = '(?<![\\p{L}\\p{N}])(?:j[aá]rv[iey][sz]{0,2}|j[aá]rb[ia]s|(?:g|ch|z)[aá]rv[iy]s)(?![\\p{L}\\p{N}])';
const WAKE = new RegExp(WAKE_SRC, 'iu');
const hasWake = s => WAKE.test(s);
const stripWake = s => {
  let t = s.replace(new RegExp(WAKE_SRC, 'giu'), ' ').replace(/\s+/g, ' ').trim();
  for (let i = 0; i < 3; i++) t = t.replace(/^(?:e\s+a[ií]|ia[ií]|iai|ent[aã]o|ei|ok|oi|ol[aá]|fala|opa|al[oô]|hey|hei)(?=[\s,.!?]|$)[\s,.!?]*/i, '').replace(/^[\s,.;:!?-]+/, '');
  return t.replace(/[\s,;:-]+$/, '').trim();
};

/* ═════════ ROTEADOR — escolhe o modelo pela complexidade do pedido ═════════ */
const COMPLEXO = /\b(laudo|parecer|quesit|peric|perit|documentosc|grafotec|forense|juridic|judicial|petic|contrato|codigo|programa|script|algoritm|depur|bug|arquitet|estrateg|planej|analis|analiz|diagnost|orcament|relatorio|redij|redig|redacao|elabor|desenvolv|calcul|compar|diferenca entre|vantage|desvantage|passo a passo|detalh|aprofund|explic|como funciona|resum|cri[ae]r?\b|ger[ae]r?\b|mont[ae]r?\b|escrev|traduz|revis|corrij|corrig|avali)/;
const MEDIO = /\b(pesquis|procur|busc|noticia|internet|ultim[ao]s|problema|erro|defeito|consert|repar|seguranc|vulnerab|invasao|ctf|por que|porque|como (eu )?(faco|fazer|posso)|qual (e )?a melhor|me ajud|ajuda com|liste|lista de)/;
const CONTINUA = /^(e|mas|entao|continua|continue|mais|como assim|por que|porque|explica|detalha|aprofunda|tambem|alem disso|outra|outro|segundo|segunda|terceiro|terceira|proximo|proxima|ok e|certo e)\b|\b(isso|disso|nisso|esse|essa|esses|essas|dele|dela|nele|nela|anterior)\b/;
const PROFUNDO = /\b(opus|pens[ae] (com calma|bem|direito|a fundo|profundamente)|reflet[ae]|reflit[ae]|analis[ae] (a fundo|com calma|profundamente|em detalhes)|a fundo|com (calma|profundidade|muito cuidado)|profundamente|detalhadamente|minucios|raciocin)/;
const SIMPLES = /^(oi|ola|e ai|eai|bom dia|boa tarde|boa noite|tudo bem|tudo certo|como vai|obrigad|valeu|beleza|tchau|ate logo|ate mais|que horas|que dia|qual (e )?a data|conta uma piada|piada)/;
const Roteador = {
  ultimo: { nivel: 'rapido', t: -1e9 },
  modo() { const m = store.raw('jarvis.modo'); return m === 'rapido' || m === 'completo' || m === 'maximo' ? m : 'auto'; },
  setModo(m) { store.rawSet('jarvis.modo', m === 'auto' ? '' : m); },
  nivel(texto) {
    const m = this.modo(), t = norm(texto).replace(/[^a-z0-9?\s]/g, ' ').replace(/\s+/g, ' ').trim(), palavras = t.split(' ').filter(Boolean).length;
    if (PROFUNDO.test(t)) return 'maximo';               // "pensa com calma", "analisa a fundo", "usa o Opus": vale em qualquer modo
    if (m !== 'auto') return m;
    const simples = SIMPLES.test(t) && palavras <= 8;
    let p = 0;
    if (COMPLEXO.test(t)) p += 3;
    if (MEDIO.test(t)) p += palavras > 8 ? 2 : 1;
    p += palavras > 34 ? 3 : palavras > 24 ? 2 : palavras > 16 ? 1 : 0;
    if ((t.match(/\?/g) || []).length > 1) p += 1;
    if (simples) p -= 3;
    const seguida = n => this.ultimo.nivel === n && performance.now() - this.ultimo.t < 120000 && palavras <= 12 && !simples && CONTINUA.test(t);   // "e o segundo quesito?" continua o assunto
    if (p >= 7 || seguida('maximo')) return 'maximo';      // pedido longo e muito complexo
    return p >= 3 || seguida('completo') ? 'completo' : 'rapido';
  },
  marcar(nivel) { this.ultimo = { nivel, t: performance.now() }; },
};

const Claude = {
  hist: [],
  key() { return CONFIG.apiKey || store.raw('jarvis.apikey'); },
  setKey(k) { store.rawSet('jarvis.apikey', k.trim()); },
  dropKey() { if (!CONFIG.apiKey) store.rawSet('jarvis.apikey', ''); },
  system() {

    return [
      { type: 'text', text: PERSONA(), cache_control: { type: 'ephemeral' } },

  /* cérebro local (assinatura do Claude Code) primeiro; a chave da API fica de reserva */
  async ask(user, h) {

      try { return await this.askLocal(user, h); }
      catch (e) {
        if (e.name === 'AbortError' || !(e instanceof TypeError) || !this.key()) throw e;

    }
    return this.askApi(user, h);
  },
  async askLocal(user, { signal, onTag, onText, onTool, onAviso, onFontes, nivel }) {
    try {
      const agora = new Date().toLocaleString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const r = await fetch(CONFIG.local.url + '/pensar', {
        method: 'POST', signal, headers: { 'content-type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({ texto: `<contexto>Agora é ${agora}.</contexto>\n${user}`, persona: PERSONA(true), nivel: nivel || 'completo' }),
      });
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        const e = new Error(j.erro || ('o servidor do Jarvis respondeu ' + r.status)); e.code = j.tipo; throw e;
      }
      const filter = new TagFilter(onTag), reader = r.body.getReader(), dec = new TextDecoder();
      let buf = '', full = '';
      const emit = t => { if (t) { full += t; onText(t); } };
      const handle = linha => {
        if (!linha.trim()) return;
        let j; try { j = JSON.parse(linha); } catch { return; }
        if (j.t === 'd') emit(filter.push(j.x));
        else if (j.t === 'ferramenta') { try { onTool && onTool(j); } catch {} }
        else if (j.t === 'aviso') { try { onAviso && onAviso(j.msg); } catch {} }
        else if (j.t === 'fontes') { try { onFontes && onFontes(j); } catch {} }
        else if (j.t === 'erro') { const e = new Error(j.msg || 'erro no cérebro local'); e.code = j.tipo; throw e; }
      };
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf('\n')) >= 0) { handle(buf.slice(0, i)); buf = buf.slice(i + 1); }
      }
      if (buf.trim()) handle(buf);
      emit(filter.flush());
      return full;
    } catch (e) { if (e.name !== 'AbortError') e.local = true; throw e; }
  },
  async askApi(user, { signal, onTag, onText, nivel }) {

    if (!key) { const e = new Error('nokey'); e.code = 'nokey'; throw e; }
    const res = await fetch('https://api.anthropic.com/v1/messages', {

    });
    if (!res.ok) {
      let msg = ''; try { const j = await res.json(); msg = (j.error && j.error.message) || ''; } catch {}
      const e = new Error(msg || 'HTTP ' + res.status); e.status = res.status; e.modelo = modelo; throw e;

    let buf = '', full = '';

    const handle = raw => {
      for (const line of raw.split('\n')) {
        if (!line.startsWith('data:')) continue;
        let j; try { j = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (j.type === 'content_block_delta' && j.delta && j.delta.type === 'text_delta') emit(filter.push(j.delta.text));

      let i; while ((i = buf.indexOf('\n\n')) >= 0) { handle(buf.slice(0, i)); buf = buf.slice(i + 2); }

/* remove as tags [[...]] do fluxo, mesmo quando chegam quebradas entre pedaços */
class TagFilter {
  constructor(onTag) { this.buf = ''; this.onTag = onTag; this.started = false; }
  push(chunk) {
    this.buf += chunk; let out = '';
    for (;;) {
      const i = this.buf.indexOf('[[');
      if (i < 0) {
        const keep = this.buf.endsWith('[') ? 1 : 0;
        out += this.buf.slice(0, this.buf.length - keep); this.buf = this.buf.slice(this.buf.length - keep); break;
      }
      out += this.buf.slice(0, i);
      const j = this.buf.indexOf(']]', i + 2);
      if (j < 0) { this.buf = this.buf.slice(i); if (this.buf.length > 900) { out += this.buf; this.buf = ''; } break; }
      try { this.onTag(this.buf.slice(i + 2, j)); } catch {}

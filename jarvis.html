    }
    return this._lead(out);
  }
  flush() { const r = this.buf.startsWith('[[') ? '' : this.buf; this.buf = ''; return this._lead(r); }
  _lead(s) { if (!this.started) { s = s.replace(/^\s+/, ''); if (s) this.started = true; } return s; }
}
const parseTag = raw => {
  const o = { tema: '', nos: [] };
  for (const part of raw.split('|')) {
    const [k, ...v] = part.split(':'); const val = v.join(':').trim(), key = norm(k.trim());
    if (key === 'tema') o.tema = norm(val).replace(/[^a-z]/g, '');
    if (key === 'nos') o.nos = val.split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
  }
  return o;
};

/* junta o texto em frases para a voz começar a falar antes da resposta terminar */
class Sentencer {
  constructor(emit) { this.buf = ''; this.emit = emit; this.primeira = true; }
  sai(piece) { this.emit(piece); this.primeira = false; }
  push(t) {
    this.buf += t;
    const re = /[.!?…]+["'”)\]]*(?=\s)|\n+/g; let m, last = 0;
    // a primeira frase sai mesmo curta ("Certamente, senhor."): a voz de mago começa em menos de um segundo
    while ((m = re.exec(this.buf))) {
      const end = m.index + m[0].length, piece = this.buf.slice(last, end).trim();
      if (piece.length >= (this.primeira ? 12 : 24)) { this.sai(piece); last = end; }
    }
    this.buf = this.buf.slice(last);
    // frase comprida sem ponto: corta na vírgula, para a voz começar antes (a primeira, mais cedo ainda)
    const limite = this.primeira ? 50 : 150;
    if (this.buf.length > limite) {
      const i = this.buf.lastIndexOf(', ');
      if (i > (this.primeira ? 20 : 30)) { this.sai(this.buf.slice(0, i + 1).trim()); this.buf = this.buf.slice(i + 2); }
    }
  }
  flush() { const r = this.buf.trim(); this.buf = ''; if (r) this.sai(r); }
}

const keyProblem = err => err.status === 401 || (err.status === 400 && /workspace/i.test(err.message || ''));
const explain = err => {
  if (err.local) {
    if (err.code === 'login') return `Preciso que você entre no Claude Code uma vez, ${CONFIG.usuario}: abra o terminal, digite claude e faça o login. Depois é só falar comigo de novo.`;
    if (err.code === 'sem-claude') return 'Não encontrei o Claude Code neste computador. Instale e faça o login, ou cole uma chave da API.';
    if (err.code === 'tempo') return 'Pensei por tempo demais e parei. Pode repetir o pedido?';
    if (err.name === 'TypeError') return 'O servidor do Jarvis não está respondendo. Dê dois cliques no iniciar-jarvis.bat e tente de novo.';
    return 'Tive um problema no cérebro local: ' + err.message;
  }
  if (err.code === 'nokey') return `Preciso da sua chave da API da Anthropic para pensar, ${CONFIG.usuario}. Cole-a no campo que apareceu logo acima.`;
  if (keyProblem(err) && err.status === 400) return 'Essa chave não está ligada a um workspace. Crie outra no Console escolhendo um workspace, como o Default, e cole no campo acima.';
  switch (err.status) {
    case 401: return 'A chave da API foi recusada. Confira se ela está correta e cole novamente no campo acima.';
    case 403: return 'A chave não tem permissão para esse pedido. Verifique o acesso dela no console da Anthropic.';
    case 404: return `Não encontrei o modelo ${err.modelo || CONFIG.modelo}. Ajuste o modelo no topo do código.`;
    case 429: return 'Atingimos o limite de pedidos por agora. Espere alguns segundos e peça de novo.';
    case 529: return 'Os servidores da Anthropic estão sobrecarregados neste momento. Tente de novo em instantes.';
  }
  if (err.status >= 500) return 'O serviço da Anthropic teve uma falha temporária. Tente de novo em instantes.';
  if (err.name === 'TypeError') return 'Não consegui falar com a API. Verifique a internet; se persistir, abra o arquivo no Chrome ou no Edge.';
  return 'Tive um problema ao pensar: ' + err.message;
};

  stats() {

    $('#stats').innerHTML = c.tipo === 'skills' ? `<b>${c.estrelas}</b> skills&nbsp;&nbsp;<b>${notas}</b> notas` : `<b>${notas}</b> notas&nbsp;&nbsp;<b>${c.sinapses}</b> sinapses`;
  },
  clock() {
    const d = new Date();
    $('#clock').textContent = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    $('#date').textContent = d.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '');
  },
  toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(this._tt); this._tt = setTimeout(() => el.classList.remove('on'), 2800); },
  tip(n) {
    const el = this.tipEl; if (!n) { el.classList.remove('on'); return; }
    el.textContent = n.label;
    const s = document.createElement('small'); s.textContent = n.item.skill ? Skills.fonte(n.item.skill) : Brain.hubName(n.item.nota.hub);
    el.appendChild(s); el.classList.add('on');
  },
  tipMove(x, y) {
    const el = this.tipEl, w = el.offsetWidth, h = el.offsetHeight;
    el.style.transform = `translate(${Math.min(x + 14, innerWidth - w - 8)}px,${Math.min(y + 14, innerHeight - h - 8)}px)`;
  },
  openPanel(node) {
    const p = this.panel, sk = node.item.skill, nota = node.item.nota, del = $('#pdel'), ul = $('#plinks');
    this.tip(null);
    p.style.setProperty('--hc', node.color.map(v => v | 0).join(','));
    if (sk) {
      $('#pcat').textContent = Skills.fonte(sk); $('#ptitle').textContent = sk.nome; $('#ptext').textContent = Skills.descricao(sk);
    } else {
      $('#pcat').textContent = Brain.hubName(nota.hub) + (nota.arquivo ? ', arquivo no Obsidian' : '');
      $('#ptitle').textContent = nota.title; $('#ptext').textContent = nota.text;
    }
    const items = Graph.adj.get(node.id).filter(x => x.kind === 'star');
    $('#plinkh').textContent = 'Sinapses'; ul.innerHTML = '';
    $('#plinkwrap').hidden = !items.length;
    for (const it of items) {
      const li = document.createElement('li'), b = document.createElement('button'), i = document.createElement('i');
      i.style.setProperty('--dot', rgb(it.color)); b.append(i, it.label);
      b.addEventListener('click', () => { Graph.select(it); this.openPanel(it); Graph.recall([it.id]); });
      li.appendChild(b); ul.appendChild(li);
    }
    const userNote = !!nota && nota.user && nota.editavel !== false;
    del.hidden = !userNote; del.classList.remove('armed'); del.textContent = 'Excluir nota';
    del.onclick = async () => {
      if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Confirmar exclusão'; setTimeout(() => { del.classList.remove('armed'); del.textContent = 'Excluir nota'; }, 3500); return; }
      const erro = await Brain.remove(node.id);
      if (erro) { this.toast(erro); return; }
      this.closePanel(); Graph.removeNote(node.id); this.stats(); this.toast('Nota excluída');
    };
    p.classList.add('open');
  },
  closePanel() { this.panel.classList.remove('open'); Graph.select(null); },
};

/* ═════════ CONVERSA — estados, palavra de ativação e turnos ═════════ */
const ACKS = [`Pois não, ${CONFIG.usuario}?`, 'Estou ouvindo.', `Às ordens, ${CONFIG.formal}.`, `Diga, ${CONFIG.usuario}.`, 'Pode falar, estou aqui.'];
const saudacao = () => { const h = new Date().getHours(); return h < 5 ? 'Boa madrugada' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; };
const GUESS = Object.entries(TEMAS).filter(([, t]) => t.palavras).map(([id, t]) => [id, t.palavras]);   // vem do PERFIL
const guessTheme = t => { for (const [k, re] of GUESS) if (re.test(t)) return k; return 'geral'; };
const NOTE_A = /^(?:por favor[, ]+)?(?:anota|anote|anotar|guarda|guarde|salva|salve|registra|registre|memoriza|memorize|grava|grave)(?:\s+(?:isso|a[ií]|pra mim|para mim|na mem[óo]ria))*\s*(?:que\b|:|,|-)?\s*(.{4,})$/i;
const NOTE_B = /^(?:lembra|lembre|lembre-se|n[ãa]o esque[çc]a)(?:\s+de)?\s+(?:que\b|:)\s*(.{4,})$/i;
const parseNote = t => { const s = t.replace(/\s+/g, ' ').trim(); const m = s.match(NOTE_A) || s.match(NOTE_B); return m ? m[1].trim() : null; };

const MODO_RE = /^(?:(?:ativa|ativar|liga|ligar|usa|usar|entra|entrar|muda|mudar|coloca|colocar|volta|voltar|passa|passar)(?: (?:o|para|pro|pra|no|em|ao))* )?(?:o )?modo (rapido|completo|avancado|maximo|opus|profundo|turbo|inteligente|automatico|hibrido|normal)(?: (?:por favor|agora|ai))?$/;
const MODO_INFO = /^(?:qual|que) (?:modo|modelo|cerebro)|^(?:voce )?(?:esta|ta) (?:usando|em) (?:qual|que) (?:modo|modelo)/;
const modelos = () => (Local.cerebro && Local.info && Local.info.hibrido) || { rapido: CONFIG.modeloRapido, completo: CONFIG.modelo, maximo: CONFIG.modeloMaximo };
const MODO_FALA = m => {
  const h = modelos(), r = nomeModelo(h.rapido), c = nomeModelo(h.completo), x = h.maximo ? nomeModelo(h.maximo) : '';
  return {
    rapido: `Modo rápido: respondo tudo com o ${r}, o mais ágil.`,
    completo: `Modo completo: respondo tudo com o ${c}, mais capaz e um pouco mais lento.`,
    maximo: x ? `Modo máximo: penso tudo com o ${x}, o mais poderoso. Demora mais e gasta mais da sua assinatura.` : `O modelo máximo está desligado no servidor; uso o ${c}.`,
    auto: `Modo automático: ${r} para o simples, ${c} para o complexo${x ? ` e ${x} quando pede raciocínio profundo` : ''}.`,
  }[m];
};
const PENSANDO = { completo: 'pensando a fundo', maximo: 'raciocínio máximo' };
const App = {
  state: 'boot', busy: false, ctl: null, windowUntil: 0, timer: 0, idleT: 0, pending: null,
  setState(s, rotulo) {
    this.state = s; document.body.dataset.state = s;
    Graph.setMode({ idle: 'idle', boot: 'idle', listening: 'listen', thinking: 'think', speaking: 'speak' }[s]);
    UI.state(s, rotulo); UI.mic();
  },
  interim(t) {
    if (t && Voice.eco(t)) return;
    if (t && hasWake(t)) Local.aquecer();
    if (!t || this.state === 'listening' || hasWake(t)) UI.interim(t);
  },
  heard(text) {
    if (this.busy || this.state === 'boot') return;
    if (Voice.eco(text)) return;                       // era o próprio Jarvis saindo pelo alto-falante
    const wake = hasWake(text), inWindow = performance.now() < this.windowUntil;
    if (!wake && !inWindow) return;
    const cmd = stripWake(text);
    Local.aquecer();
    const bare = norm(cmd).replace(/[^a-z ]/g, '').trim();
    if (!bare) { UI.say('me', text); this.local(pick(ACKS)); return; }
    if (/^(bom dia|boa tarde|boa noite|boa madrugada)$/.test(bare)) { UI.say('me', text); this.local(`${saudacao()}, ${CONFIG.usuario}. Em que posso ajudar?`); return; }
    this.ask(cmd);
  },
  /* resposta local, sem passar pelo cérebro */
  local(text, tema = 'geral', keepEar) {
    this.stop(true); this.busy = true; if (!keepEar) Ear.pause();
    Theme.respond(tema); UI.say('jarvis', text);
    Voice.say(text); Voice.finish();
  },
  async ask(text, retry) {
    text = text.trim(); if (!text) return;
    this.stop(true);
    if (!retry) UI.say('me', text);
    if (/^(nova conversa|novo assunto|reinicia(r)? a conversa|come[çc]a(r)? do zero|esque[çc]a (a|essa) conversa)[.!]*$/i.test(text)) {
      Claude.hist = [];
      if (Local.cerebro) fetch(CONFIG.local.url + '/reiniciar', { method: 'POST', headers: { 'content-type': 'text/plain' }, body: '{}' }).catch(() => {});
      UI.separador('nova conversa');
      return this.local(`Certo, ${CONFIG.usuario}. Começamos do zero.`, 'geral');
    }
    if (/\b(testa|testar|teste|demonstra|mostra|ouvir)\b.*\bvozes\b/i.test(norm(text))) return this.demoVozes();
    const curto = norm(text).replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim(), modo = curto.match(MODO_RE);
    if (modo) {
      const m = { rapido: 'rapido', completo: 'completo', avancado: 'completo', maximo: 'maximo', opus: 'maximo', profundo: 'maximo', turbo: 'maximo' }[modo[1]] || 'auto';
      Roteador.setModo(m); return this.local(`Feito. ${MODO_FALA(m)}`, 'geral');
    }
    if (MODO_INFO.test(curto)) return this.local(MODO_FALA(Roteador.modo()), 'geral');
    const galaxia = curto.match(/^(?:mostra|mostrar|mostre|exibe|exibir|ver|abre|abrir|volta|voltar)(?: (?:as|os|minhas|meus|para|pra|pro|a|o))* (notas|memorias|second brain|skills|habilidades|estrelas)\b/);
    if (galaxia) return this.trocaGalaxia(/skills|habilidades|estrelas/.test(galaxia[1]) ? 'skills' : 'notas');
    const graf = curto.match(/^(?:(?:deixa|deixe|coloca|coloque|usa|use|ativa|liga|muda|mude)(?: (?:os|o|para|pra|pro|em|no))* )?(?:graficos?|visual|efeitos) (leves?|economicos?|basicos?|simples|normais?|automaticos?|no maximo|maximos?|altos?|bonitos?|pesados?)$|^modo (leve|economia)$/);
    if (graf) {
      const q = /^(lev|econ|basic|simpl)/.test(graf[1] || graf[2]) ? 'leve' : /^(norm|autom)/.test(graf[1]) ? 'auto' : 'alta';
      Graph.setGraficos(q);
      return this.local({ leve: 'Pronto. Gráficos leves: menos partículas e menos quadros por segundo. Para voltar, diga: gráficos normais.',
        auto: 'Gráficos normais, com qualidade automática: se o computador apertar, eu alivio sozinho.',
        alta: 'Gráficos no máximo. Se ficar pesado, diga: gráficos leves.' }[q], 'geral');
    }
    if (/^(?:congela|congelar|congele|para|parar|pare|trava|travar|trave)(?: de girar)?(?: (?:a|o))? (?:galaxia|giro)(?: de girar)?$|^(?:a )?galaxia parada$/.test(curto)) {
      Graph.setGiro(false); return this.local('Galáxia congelada. Para voltar a girar, diga: gira a galáxia.', 'geral');
    }
    if (/^(?:gira|girar|gire|solta|soltar|solte|destrava|destravar|volta a girar|voltar a girar|liga o giro)(?: (?:a|o))? (?:galaxia|giro)$|^(?:a )?galaxia girando$/.test(curto)) {
      Graph.setGiro(true); return this.local('A galáxia voltou a girar.', 'geral');
    }
    const painel = curto.match(/^(esconde|esconder|esconda|minimiza|minimizar|minimize|fecha|fechar|feche|recolhe|recolher|mostra|mostrar|mostre|abre|abrir|abra|exibe|exibir)(?: (?:a|o|as|os))? (conversa|chat|texto|historico|painel|paineis|avisos|notificacoes|cartoes|tudo)$/);
    if (painel) {
      const on = /^(mostr|abr|exib)/.test(painel[1]), alvo = painel[2], quais = /paineis|tudo/.test(alvo) ? ['conversa', 'avisos'] : /conversa|chat|texto|historico/.test(alvo) ? ['conversa'] : ['avisos'];
      quais.forEach(q => UI.mostrar(q, on));
      return this.local(on ? 'Pronto, à vista.' : 'Feito. Para trazer de volta, diga: mostra ' + (quais.length > 1 ? 'tudo' : quais[0] === 'conversa' ? 'a conversa' : 'o painel') + '.', 'geral');
    }
    if (/^(?:limpa|limpar|limpe|apaga|apagar|apague)(?: (?:a|o|as|os))? (?:painel|avisos|notificacoes|cartoes)$/.test(curto)) { Avisos.limpar(); return this.local('Painel limpo.', 'geral'); }
    if (/^(?:atualiza|atualizar|atualize|busca|buscar|busque|traz|traga|carrega|carregar)(?: (?:as|os))? (?:noticias|manchetes)(?: (?:de hoje|do dia|agora))?$/.test(curto)) {
      if (!Local.cerebro) return this.local('Para buscar notícias eu preciso do servidor do Jarvis com o Claude Code.', 'geral');
      UI.mostrar('avisos', true);
      Noticias.buscar().then(ok => { if (!ok) UI.say('sys', 'Não consegui trazer as notícias agora. Tente de novo em alguns minutos.'); });
      return this.local('Buscando as notícias de hoje. Elas aparecem no painel da direita em instantes.', 'geral');
    }
    const auto = curto.match(/^(liga|ligar|ativa|ativar|desliga|desligar|desativa|desativar)(?: (?:as|os))? (?:noticias|manchetes)(?: automaticas| automaticamente)?$/);
    if (auto) {
      const on = !/^des/.test(auto[1]); store.set('jarvis.noticias', on);
      return this.local(on ? 'Notícias automáticas ligadas: a cada três horas aparecem no painel da direita.' : 'Notícias automáticas desligadas. Quando quiser, diga: atualiza as notícias.', 'geral');
    }
    const vc = voiceCommand(text);
    if (vc) { Promise.resolve(vc).then(r => this.local(r, 'geral')); return; }
    const nota = parseNote(text);
    if (nota) return this.saveNote(nota);

    const nivel = Roteador.nivel(text);
    this.busy = true; Ear.pause(); Graph.forca = nivel === 'maximo' ? 1.7 : 1; this.setState('thinking', PENSANDO[nivel]);
    Theme.respond(guessTheme(text));
    Graph.recall([...Brain.search(text).map(n => n.id), ...Skills.buscar(text)].filter(id => Graph.byId.has(id)));
    const el = UI.say('jarvis', ''); UI.update(el, '', true);
    const ctl = this.ctl = new AbortController();
    const sent = new Sentencer(s => Voice.say(s));
    let shown = '';
    try {
      await Claude.ask(text, {
        signal: ctl.signal, nivel,
        onTag: raw => {
          if (/^\s*cart[aã]o\s*:/i.test(raw)) { Avisos.add(parseCartao(raw)); return; }   // conteúdo para ver, não para ouvir
          const t = parseTag(raw); if (t.tema) Theme.respond(TEMAS[t.tema] ? t.tema : 'geral');
          const ids = t.nos.filter(id => Graph.byId.has(id)); if (ids.length) Graph.recall(ids);
        },
        onFontes: f => { const links = (f.links || []).filter(l => linkSeguro(l.url)); if (links.length) Avisos.add({ tipo: 'fonte', titulo: f.consulta ? 'Fontes: ' + f.consulta : 'Fontes da pesquisa', links }); },
        onTool: f => {
          if (ctl.signal.aborted) return;
          const web = /^Web(Search|Fetch)$/.test(f.nome), alvo = f.skill ? Graph.porNome(f.skill) : null;
          sent.flush();                                     // fala o "um momento, vou verificar" antes de pesquisar
          this.setState('thinking', web ? 'pesquisando na web' : alvo ? 'usando ' + alvo.label : 'consultando');
          if (alvo) Graph.recall([alvo.id]);
          Graph.tempestade(alvo);
        },
        onAviso: msg => { if (msg) UI.say('sys', msg); },
        onText: chunk => { if (ctl.signal.aborted) return; shown += chunk; UI.update(el, shown, true); sent.push(chunk); },
      });
      if (ctl.signal.aborted) return;
      Roteador.marcar(nivel);
      sent.flush(); UI.update(el, shown || '…', false);
    } catch (err) {
      if (ctl.signal.aborted || err.name === 'AbortError') return;
      const msg = explain(err);
      Theme.respond('alerta'); UI.update(el, msg, false); el.classList.add('err');
      if (err.code === 'nokey' || keyProblem(err)) { if (keyProblem(err)) Claude.dropKey(); this.pending = text; UI.keybar(true); }
      Voice.say(msg);
    }
    if (this.ctl === ctl) Voice.finish();
  },
  /* fala uma frase curta em cada voz para você escolher pelo ouvido */
  demoVozes() {
    this.stop(true); this.busy = true; Ear.pause(); Theme.respond('geral');
    if (Voice.engine() === 'kokoro') {
      UI.say('jarvis', 'Vou falar uma frase em cada voz. Depois diga, por exemplo: Jarvis, usa a voz Mago brasileiro.');
      KOKORO_VOZES.forEach((v, i) => Voice.say(`${i + 1}. Esta é a voz ${v.nome}. Sistemas online, ${CONFIG.usuario}.`, v.id));
    } else {
      const l = Voice.pt().slice(0, 6);
      UI.say('jarvis', l.length ? 'Vou falar uma frase em cada voz do navegador. Depois diga: Jarvis, usa a voz, e o nome.' : 'Este navegador não tem vozes em português.');
      l.forEach(v => Voice.say(`Esta é a voz ${Voice.short(v)}.`, v));
    }
    Voice.finish();
  },
  async saveNote(content) {
    const n = await Brain.addUser(content);
    Graph.syncNotas(); Graph.recall([n.id]); Graph.tempestade(Graph.byId.get(n.id));
    UI.stats(); UI.toast('Nota salva em ' + Brain.hubName(n.hub));
    this.local(pick([`Anotado, ${CONFIG.usuario}. Guardei em ${Brain.hubName(n.hub)}.`, `Feito. A nota já está conectada à área ${Brain.hubName(n.hub)}.`, `Registrado no seu Second Brain, ${CONFIG.formal}, em ${Brain.hubName(n.hub)}.`]), 'ideia');
  },
  /* "Jarvis, mostra as notas" / "mostra as skills": troca o que as estrelas da galáxia representam */
  trocaGalaxia(tipo) {
    if (tipo === 'skills' && !Skills.lista.length) return this.local('Não encontrei skills instaladas. Abra o Jarvis pelo iniciar-jarvis.bat para eu ler as skills do seu Claude Code.', 'geral');
    if (tipo === 'skills') Graph.useSkills(Skills.lista); else Graph.useNotas();
    Graph.ignite(); UI.stats(); UI.closePanel();
    const n = Graph.counts().estrelas;
    this.local(tipo === 'skills' ? `Pronto. Cada uma das ${n} estrelas é uma skill instalada.` : `Pronto. Agora as ${n} estrelas são as notas do seu Second Brain.`, 'geral');
  },
  /* chamado pela voz: true ao começar a falar, false quando terminou tudo */
  speaking(on) {
    if (on) { if (this.busy && this.state !== 'speaking') this.setState('speaking'); return; }
    if (!this.busy) return;
    this.busy = false; this.ctl = null;
    clearTimeout(this.idleT); this.idleT = setTimeout(() => { if (!this.busy) Theme.idle(); }, 700);
    Ear.resume();
    const listening = Ear.want && Ear.ok;
    this.windowUntil = listening ? performance.now() + CONFIG.janelaMs : 0;
    this.setState(listening ? 'listening' : 'idle');
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { if (this.state === 'listening' && !this.busy) this.setState('idle'); }, CONFIG.janelaMs);
  },
  /* interrompe fala e pensamento em andamento */
  stop(silent) {
    const was = this.busy;
    if (this.ctl) { this.ctl.abort(); this.ctl = null; }
    Voice.cancel();
    if (was) {
      this.busy = false;
      if (!silent) { Theme.idle(); Ear.resume(); this.windowUntil = performance.now() + CONFIG.janelaMs; this.setState(Ear.want ? 'listening' : 'idle'); }
    }
  },
  /* toque no núcleo: interrompe, ou abre a escuta */
  core() {
    if (this.busy) { this.stop(); return; }
    if (Ear.ok && !Ear.want) Ear.start();
    if (Ear.ok && Ear.want) this.local(pick(ACKS), 'geral');
    else $('#txt').focus();
  },
};

/* ═════════ INICIALIZAÇÃO ═════════ */
const EMBUTIDO = (() => { try { return window.self !== window.top; } catch { return true; } })();   // prévia dentro de outro app
function aplicarNotas() { Graph.syncNotas(); UI.stats(); }
const nomeModelo = m => { const s = String(m || ''), b = s.match(/haiku|sonnet|opus/i); return b ? b[0][0].toUpperCase() + b[0].slice(1).toLowerCase() : s; };

async function boot() {
  const blog = $('#blog'), fast = REDUCED ? 0.3 : 1, PAD = innerWidth < 640 ? 25 : 40;
  const line = async (label, status, cls = 'ok', wait = 380) => {
    const row = document.createElement('div');
    row.textContent = (label + ' ').padEnd(PAD, '.') + ' ';
    const s = document.createElement('span'); s.className = cls; s.textContent = status;
    blog.appendChild(row); await sleep(wait * fast * 0.5); row.appendChild(s); await sleep(wait * fast * 0.5);
  };
  await sleep(500 * fast);
  Graph.birth();
  await line('Núcleo de luz', 'aceso', 'ok', 700);
  await line('Galáxia 3D de Fibonacci', Ceu.ok ? (Graph.giro ? 'em rotação' : 'congelada') : 'modo simples, sem WebGL', Ceu.ok ? 'ok' : 'warn', 420);
  for (let i = 0; i < 8 && Voice.ok && !Voice.list.length; i++) await sleep(100);
  Voice.choose();
  await line('Voz do navegador', !Voice.ok ? 'indisponível' : Voice.nuvem() ? `${Voice.label()}, natural (nuvem da Microsoft)` : Voice.label(), Voice.voice ? 'ok' : 'warn');
  const lk = await Local.probe(), kk = Kokoro.ok;
  if (lk && location.protocol === 'file:' && !EMBUTIDO) { location.replace(CONFIG.local.url + '/'); return; }   // abre pelo servidor
  await line('Servidor do Jarvis', lk ? 'conectado' : 'não encontrado', lk ? 'ok' : 'warn');
  const leve = Local.info && Local.info.motor_voz === 'onnx';
  await line('Voz de mago (Kokoro)', kk && Voice.engine() !== 'kokoro' ? 'pronta, em espera (diga: voz de mago)'
    : kk ? Kokoro.nome(Voice.kvoz()) + (leve ? ', rápida (ONNX)' : ', local')
    : Local.vozPreparando ? `baixando a versão rápida, ${Local.progresso}%` : Local.erroRapida ? 'não consegui baixar a versão rápida' : 'indisponível', kk ? 'ok' : 'warn');
  if (Local.notas) {
    const s = await Brain.syncLocal();
    if (s) aplicarNotas(s);
    await line('Memória em Markdown', s ? s.novas.length + (s.novas.length === 1 ? ' nota' : ' notas') + ' em arquivos' : 'falhou ao ler', s ? 'ok' : 'warn');
  }
  const sk = lk ? await Skills.carregar() : [];                 // uma estrela para cada skill instalada
  if (sk.length) Graph.useSkills(sk); else Graph.useNotas();
  const row = document.createElement('div'); row.textContent = (sk.length ? 'Skills instaladas ' : 'Second Brain ').padEnd(PAD, '.') + ' '; blog.appendChild(row);
  await sleep(Math.min(Graph.ignite(), 2000) * fast);
  const c = Graph.counts(), s2 = document.createElement('span'); s2.className = 'ok';
  s2.textContent = sk.length ? `${c.estrelas} ${c.estrelas === 1 ? 'estrela' : 'estrelas'} em espiral` : `${c.estrelas} notas em estrelas`; row.appendChild(s2);
  await sleep(250 * fast);
  await line('Reconhecimento de voz', Ear.ok ? 'pronto' : 'indisponível, use o teclado', Ear.ok ? 'ok' : 'warn');
  const hib = Local.info && Local.info.hibrido;
  const modo = Roteador.modo(), tem = Local.cerebro || !!Claude.key(), h = modelos(), via = Local.cerebro ? '' : ' pela API';
  const lista = [h.rapido, h.completo, h.maximo].filter(Boolean).map(nomeModelo), juntos = lista.slice(0, -1).join(', ') + ' e ' + lista[lista.length - 1];
  const cerebro = !tem ? 'aguardando chave da API'
    : modo !== 'auto' ? `modo ${{ rapido: 'rápido', completo: 'completo', maximo: 'máximo' }[modo]}, ${nomeModelo(h[modo] || h.completo)}${via}`
    : Local.cerebro && !hib ? 'sua assinatura do Claude Code' : `híbrido, ${juntos}${via}`;
  await line('Cérebro Claude', cerebro, tem ? 'ok' : 'warn');
  await line('Personalidade híbrida', 'carregada');
  await line('Paleta neon por contexto', 'calibrada');
  $('#start').hidden = false; $('#bhint').hidden = !Ear.ok; $('#start').focus();
}

function activate() {
  FX.unlock();                          // libera o áudio dentro do clique
  $('#boot').classList.add('off'); document.body.classList.add('live');
  Graph.igniteAll(); UI.stats();
  App.setState('idle');
  const n = Brain.notes.filter(x => !x.sys).length, k = Skills.lista.length, h = new Date().getHours();
  const orbita = k ? `${k} skills em órbita e ${n} notas no Second Brain` : `seu Second Brain carregado com ${n} notas`;
  const fala = h < 5
    ? `${saudacao()}, ${CONFIG.usuario}. Trabalhando a esta hora, ${CONFIG.formal}? Admirável, ou preocupante. Sistemas online, ${orbita}.`
    : `${saudacao()}, ${CONFIG.usuario}. Todos os sistemas online, ${orbita}. Ao seu dispor.`;
  App.local(fala, 'geral', true);       // fala dentro do clique: libera o áudio do navegador
  if (Ear.ok) Ear.start();              // pede o microfone já no primeiro gesto
  UI.layout(); Noticias.agendar();
  if (Local.vozPreparando || Local.rapidaPreparando) Kokoro.aguardar();
  else if (!Kokoro.ok && Local.erroRapida) Kokoro.semRapida();
  if (EMBUTIDO) UI.say('sys', 'Esta é só uma prévia: aqui o microfone e o servidor do seu computador ficam bloqueados. Para usar de verdade, dê dois cliques no iniciar-jarvis.bat no seu computador.');
  if (!Claude.key() && !Local.cerebro) UI.keybar(true);
  if (!store.get('jarvis.dica', false)) {
    UI.say('sys', Ear.ok ? `Diga “${CONFIG.assistente}” e o seu pedido, por exemplo: “${CONFIG.exemplo}”. Toque no núcleo para interromper.` : 'Escreva abaixo para conversar. Para usar a voz, abra no Chrome ou no Edge.');
    store.set('jarvis.dica', true);
  }
  if (Voice.engine() === 'kokoro' && !store.get('jarvis.dicakokoro', false)) {
    UI.say('sys', 'Voz de mago ativa. Ajuste com “Jarvis, mais eco”, “voz mais grave”, “fala mais devagar” ou “troca a voz”.');
    store.set('jarvis.dicakokoro', true);
  }
  if (Voice.nuvem() && !store.get('jarvis.dicanatural', false)) {
    Avisos.add({ tipo: 'dica', titulo: 'Voz natural da Microsoft', texto: `Estou falando com a voz natural ${Voice.label()}, gerada na nuvem da Microsoft: não usa o processador do notebook (precisa de internet). Para a voz de mago, diga “Jarvis, voz de mago”; para voltar, “Jarvis, voz natural”.` });
    store.set('jarvis.dicanatural', true);
  } else if (Voice.ok && !Voice.melhorNatural() && !/\bEdg\//.test(navigator.userAgent) && !EMBUTIDO && !store.get('jarvis.dicaedge', false)) {
    Avisos.add({ tipo: 'dica', titulo: 'Voz natural sem gastar o processador', texto: 'No navegador Microsoft Edge o Jarvis ganha a voz natural Antonio, gerada na nuvem da Microsoft, sem usar o processador. O ícone Jarvis da área de trabalho já abre no Edge.' });
    store.set('jarvis.dicaedge', true);
  }
  if (Voice.ok && !store.get('jarvis.dicavoz', false)) {
    UI.say('sys', 'Para ajustar a voz: “Jarvis, voz mais grave”, “fala mais devagar”, “troca a voz” ou “lista as vozes”.');
    store.set('jarvis.dicavoz', true);
  }
}

function init() {
  Brain.load();
  UI.init(); Voice.init(); Ear.init();
  Graph.onPick = n => {
    if (!n) { UI.closePanel(); return; }
    if (n.kind === 'core') { App.core(); return; }
    Graph.select(n); UI.openPanel(n); Graph.recall([n.id]);
  };
  Graph.init($('#brain'), $('#ceu')); UI.layout();
  Theme.idle(); App.setState('boot'); UI.state('boot');
  $('#start').addEventListener('click', activate);
  boot();
  window.__jarvis = { App, Graph, Theme, Voice, Ear, Brain, Claude, UI, Kokoro, FX, Local, Skills, Roteador, Ceu, Avisos, Noticias };
}
init();
})();
</script>
</body>
</html>
